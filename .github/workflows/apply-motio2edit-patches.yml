name: Apply MOTIO2EDIT Image Studio patches
on:
  workflow_dispatch:
  push:
    paths:
      - "scripts/generate_studio_taglines.py"
      - "scripts/patch_generate_motio2edit.py"
      - ".restore/ie_py_part*.txt"
      - ".restore/assemble_ie_patch.py"
      - ".github/workflows/apply-motio2edit-patches.yml"
      - ".restore/TRIGGER_MOTIO_PATCH"
concurrency:
  group: apply-motio2edit-patches
  cancel-in-progress: true
jobs:
  apply:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Assemble ImageEditor patch script
        run: |
          set -euo pipefail
          ls -la .restore/ie_py_part*.txt
          python3 .restore/assemble_ie_patch.py
          test -f scripts/patch_image_editor_motio2edit_full.py
      - name: Generate 220 taglines
        run: |
          set -euo pipefail
          python3 scripts/generate_studio_taglines.py
          test -f src/lib/studio/studio-taglines.ts
          grep -q pickStudioTagline src/lib/studio/studio-taglines.ts
      - name: Patch ImageEditor
        run: |
          set -euo pipefail
          python3 scripts/patch_image_editor_motio2edit_full.py
          test $(wc -c < src/components/editor/image/ImageEditor.tsx) -gt 50000
          grep -q VoiceInputButton src/components/editor/image/ImageEditor.tsx
          grep -q canAccessImageExperience src/components/editor/image/ImageEditor.tsx
          grep -q "What will you create today" src/components/editor/image/ImageEditor.tsx
          ! grep -q "Describe or upload to begin" src/components/editor/image/ImageEditor.tsx
      - name: Patch generate.functions
        run: |
          set -euo pipefail
          python3 scripts/patch_generate_motio2edit.py
          grep -q assertImageExperienceAccess src/lib/generate.functions.ts
          grep -q premUrls src/lib/generate.functions.ts
      - name: Commit
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/components/editor/image/ImageEditor.tsx src/lib/generate.functions.ts src/lib/studio/studio-taglines.ts src/lib/studio/studio-taglines-a.ts src/lib/studio/studio-taglines-b.ts
          if git diff --cached --quiet; then echo no changes; exit 0; fi
          git commit -m "fix(image-studio): MOTIO2EDIT — experience locks, VoiceInput, taglines, Auto/Composer, avatar Balance, server multi-ref"
          git push origin HEAD:main
