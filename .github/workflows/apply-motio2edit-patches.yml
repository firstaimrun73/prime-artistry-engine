name: Apply MOTIO2EDIT Image Studio patches
on:
  workflow_dispatch:
  push:
    paths:
      - "scripts/generate_studio_taglines.py"
      - "scripts/patch_generate_motio2edit.py"
      - "scripts/patch_ie_step1_imports.py"
      - "scripts/patch_ie_step2_locks.py"
      - "scripts/patch_ie_step3_empty_header.py"
      - "scripts/install_step4_mic_modes.py"
      - "scripts/install_step5_gen_suggestions.py"
      - ".github/workflows/apply-motio2edit-patches.yml"
      - ".restore/TRIGGER_MOTIO_PATCH"
concurrency:
  group: apply-motio2edit-patches
  cancel-in-progress: true
jobs:
  apply:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Install steps 4-5
        run: |
          python3 scripts/install_step4_mic_modes.py
          python3 scripts/install_step5_gen_suggestions.py
      - name: Generate taglines
        run: python3 scripts/generate_studio_taglines.py
      - name: Patch ImageEditor
        run: |
          set -euo pipefail
          python3 scripts/patch_ie_step1_imports.py
          python3 scripts/patch_ie_step2_locks.py
          python3 scripts/patch_ie_step3_empty_header.py
          python3 scripts/patch_ie_step4_mic_modes.py
          python3 scripts/patch_ie_step5_gen_suggestions.py
      - name: Patch generate.functions
        run: python3 scripts/patch_generate_motio2edit.py
      - name: Verify
        run: |
          set -euo pipefail
          test $(wc -c < src/components/editor/image/ImageEditor.tsx) -gt 50000
          grep -q VoiceInputButton src/components/editor/image/ImageEditor.tsx
          grep -q canAccessImageExperience src/components/editor/image/ImageEditor.tsx
          grep -q "What will you create today" src/components/editor/image/ImageEditor.tsx
          ! grep -q "Describe or upload to begin" src/components/editor/image/ImageEditor.tsx
          grep -q assertImageExperienceAccess src/lib/generate.functions.ts
          grep -q pickStudioTagline src/lib/studio/studio-taglines.ts
      - name: Commit
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/components/editor/image/ImageEditor.tsx src/lib/generate.functions.ts src/lib/studio/studio-taglines.ts src/lib/studio/studio-taglines-a.ts src/lib/studio/studio-taglines-b.ts
          if git diff --cached --quiet; then echo no changes; exit 0; fi
          git commit -m "fix(image-studio): MOTIO2EDIT — experience locks, VoiceInput, taglines, Auto/Composer, avatar Balance, server multi-ref"
          git push origin HEAD:main
