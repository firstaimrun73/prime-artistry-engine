name: restore-image-editor-full
on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/restore-image-editor-full.yml"
jobs:
  restore:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Restore full ImageEditor
        run: |
          set -euo pipefail
          git show 53c55f95c0d2c4623f6ce0fd7b2be14de11b8724:src/components/editor/image/ImageEditor.tsx > /tmp/ImageEditor.tsx
          python3 scripts/patch-image-editor-sponsor.py /tmp/ImageEditor.tsx src/components/editor/image/ImageEditor.tsx

      - name: Commit
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/components/editor/image/ImageEditor.tsx
          if git diff --cached --quiet; then echo "no changes"; exit 0; fi
          git commit -m "fix(image-studio): restore full ImageEditor + client-only FreeUserSponsorStrip"
          git push
