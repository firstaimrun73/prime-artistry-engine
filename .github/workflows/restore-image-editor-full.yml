name: restore-image-editor-full
on:
  workflow_dispatch:
jobs:
  restore:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Restore full ImageEditor from known-good + sponsor unlock
        run: |
          set -euo pipefail
          # Known-good full body (desktop UI + all handlers)
          git show 53c55f95c0d2c4623f6ce0fd7b2be14de11b8724:src/components/editor/image/ImageEditor.tsx > src/components/editor/image/ImageEditor.tsx
          python3 << 'PY'
          from pathlib import Path
          p = Path("src/components/editor/image/ImageEditor.tsx")
          src = p.read_text(encoding="utf-8")

          # 1) Imports (client-only sponsor)
          old_imp = '''import { CreditWarningBanner, LOW_CREDIT_TOAST_KEY } from "@/components/CreditWarningBanner";
import { toast } from "sonner";'''
          new_imp = '''import { CreditWarningBanner, LOW_CREDIT_TOAST_KEY } from "@/components/CreditWarningBanner";
import { FreeUserSponsorStrip } from "@/components/sponsor/FreeUserSponsorStrip";
import { isSponsorUnlockActive } from "@/lib/sponsor-unlock";
import { toast } from "sonner";'''
          if old_imp not in src:
              raise SystemExit("import anchor missing — abort")
          src = src.replace(old_imp, new_imp, 1)

          # 2) Watermark preference: free forced ON unless client session unlock
          old_wm = '''  useEffect(() => {
    setKeepWatermark(readKeepWatermarkPref());
  }, []);'''
          new_wm = '''  useEffect(() => {
    // Free users: watermark forced ON unless sponsor unlock is active this session.
    // Server watermark policy is unchanged — this only drives client UI preference.
    if ((profile?.plan ?? "free") === "free" && !isAdminEmail(profile?.email)) {
      setKeepWatermark(!isSponsorUnlockActive());
    } else {
      setKeepWatermark(readKeepWatermarkPref());
    }
  }, [profile?.plan, profile?.email]);'''
          if old_wm not in src:
              raise SystemExit("wm effect anchor missing — abort")
          src = src.replace(old_wm, new_wm, 1)

          # 3) Render FreeUserSponsorStrip near credit banner (UI only)
          old_banner = '''            <CreditWarningBanner credits={profile.credits} isAdmin={isAdmin} />'''
          new_banner = '''            <CreditWarningBanner credits={profile.credits} isAdmin={isAdmin} />
            <div className="mt-2">
              <FreeUserSponsorStrip isFree={isFree} />
            </div>'''
          if old_banner not in src:
              raise SystemExit("banner anchor missing — abort")
          src = src.replace(old_banner, new_banner, 1)

          # Header note
          src = src.replace(
              """/**\n * Image Editor workspace — independent of Video Editor.\n * UPLOAD → WRITE & SELECT → GENERATE → OUTPUT (compact glass UI)\n */""",
              """/**\n * Image Editor workspace — independent of Video Editor.\n * UPLOAD → WRITE & SELECT → GENERATE → OUTPUT (compact glass UI)\n * RESTORED 2026-11-04 from 53c55f95 + FreeUserSponsorStrip (client-only Multitag unlock)\n */""",
              1,
          )

          p.write_text(src, encoding="utf-8")
          print("patched bytes", len(src))
          assert "FreeUserSponsorStrip" in src
          assert "isSponsorUnlockActive" in src
          assert "runImageJob" in src or "generateMedia" in src
          assert "Loading full Image Studio" not in src
          assert "TEMP incomplete" not in src
          print("OK")
          PY
      - name: Commit and push
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/components/editor/image/ImageEditor.tsx
          if git diff --cached --quiet; then
            echo "No changes"
            exit 0
          fi
          git commit -m "fix(image-studio): restore full ImageEditor + client-only FreeUserSponsorStrip/Multitag unlock

Root cause: ImageEditor was a recovery stub (~19kB) missing the full UI.
Restored known-good body from 53c55f95 (desktop UI + handlers) and wired:
- FreeUserSponsorStrip (Multitag loads only on user click)
- isSponsorUnlockActive for free watermark UI preference
- No backend/policy changes; server watermark still authoritative"
          git push
