name: Restore full ImageEditor
on:
  workflow_dispatch:
  push:
    paths:
      - ".restore/ie_full_part*.txt"
      - "scripts/assemble_image_editor_full.py"
      - ".restore/TRIGGER_IE_FULL"
jobs:
  restore:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Assemble ImageEditor
        run: python3 scripts/assemble_image_editor_full.py
      - name: Verify
        run: |
          wc -c src/components/editor/image/ImageEditor.tsx
          grep -q "VoiceInputButton" src/components/editor/image/ImageEditor.tsx
          grep -q "pickStudioTagline" src/components/editor/image/ImageEditor.tsx
          grep -q "canAccessImageExperience" src/components/editor/image/ImageEditor.tsx
          ! grep -q "Image Studio loading" src/components/editor/image/ImageEditor.tsx
          ! grep -q "Describe or upload" src/components/editor/image/ImageEditor.tsx
      - name: Commit restored file
        run: |
          git config user.name "firstaimrun73"
          git config user.email "firstaimrun73@gmail.com"
          git add src/components/editor/image/ImageEditor.tsx
          git diff --cached --quiet && echo "no change" && exit 0
          git commit -m "CRITICAL HOTFIX: restore full 52k ImageEditor.tsx (MOTIO2EDIT VoiceInput + taglines + multi-ref + experience locks)"
          git push
