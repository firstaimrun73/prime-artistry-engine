name: Restore CircleEditShell
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/restore-circle-shell.yml'
      - 'scripts/apply-item3-ink.py'
concurrency:
  group: restore-circle-shell
  cancel-in-progress: true
jobs:
  restore:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply item 3 ink swatch sticky selection
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          python3 scripts/apply-item3-ink.py
          git add src/components/circle-edit/CircleEditShell.tsx
          if git diff --cached --quiet; then
            echo "No changes"
            exit 0
          fi
          git commit -m "Circle2edit item 3: ink colour swatch sticky selection + clear active state"
          for i in 1 2 3 4 5 6 7 8; do
            if git pull --rebase origin main && git push; then
              echo "PUSH OK"
              break
            fi
            echo "retry $i"
            sleep 4
          done
          grep -n data-active-ink src/components/circle-edit/CircleEditShell.tsx | head
          wc -c src/components/circle-edit/CircleEditShell.tsx
