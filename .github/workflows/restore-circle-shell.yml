name: Restore CircleEditShell
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/restore-circle-shell.yml'
concurrency:
  group: restore-circle-shell
  cancel-in-progress: true
jobs:
  restore:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Restore full CircleEditShell from known-good commit
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          curl -fsSL "https://raw.githubusercontent.com/firstaimrun73/prime-artistry-engine/ada3b6962508a033450086a8fd5a93ec48eec779/src/components/circle-edit/CircleEditShell.tsx" -o src/components/circle-edit/CircleEditShell.tsx
          LINES=$(wc -l < src/components/circle-edit/CircleEditShell.tsx)
          CHARS=$(wc -c < src/components/circle-edit/CircleEditShell.tsx)
          echo "fetched lines=$LINES chars=$CHARS"
          test "$LINES" -ge 600
          test "$CHARS" -ge 20000
          if grep -q "PLACEHOLDER" src/components/circle-edit/CircleEditShell.tsx; then
            echo "ERROR: still placeholder"; exit 1
          fi
          head -3 src/components/circle-edit/CircleEditShell.tsx
          tail -3 src/components/circle-edit/CircleEditShell.tsx

          git add src/components/circle-edit/CircleEditShell.tsx
          if git diff --cached --quiet; then
            echo "Already matches — nothing to commit"
            exit 0
          fi
          git commit -m "fix: restore complete CircleEditShell (undo PLACEHOLDER_TOO_LARGE)"
          for i in 1 2 3 4 5 6 7 8; do
            if git pull --rebase origin main && git push; then
              echo "PUSH OK"
              break
            fi
            echo "retry $i"
            sleep 4
          done
          echo "=== verify ==="
          wc -c src/components/circle-edit/CircleEditShell.tsx
