name: Apply ImageEditor glass layout
on:
  workflow_dispatch:
  push:
    paths:
      - '.restore/image_editor_layout.part*.b64'
      - '.restore/manifest.json'
      - '.github/workflows/apply-image-editor-layout.yml'
concurrency:
  group: apply-image-editor-layout
  cancel-in-progress: true
jobs:
  apply:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Reassemble ImageEditor layout
        run: |
          set -euo pipefail
          python3 << 'PY'
          import base64, json
          from pathlib import Path
          manifest = json.loads(Path(".restore/manifest.json").read_text())
          for item in manifest["items"]:
              if item["path"] != "src/components/editor/image/ImageEditor.tsx":
                  continue
              prefix = item["prefix"]
              parts = item["parts"]
              b64 = ""
              for i in range(parts):
                  p = Path(f".restore/{prefix}.part{i}.b64")
                  if not p.exists():
                      raise SystemExit(f"missing {p}")
                  b64 += p.read_text().strip()
              data = base64.b64decode(b64)
              Path(item["path"]).write_bytes(data)
              print(item["path"], len(data))
          PY
          BYTES=$(wc -c < src/components/editor/image/ImageEditor.tsx)
          echo "size=$BYTES"
          test "$BYTES" -gt 40000
          grep -q 'export function ImageEditor' src/components/editor/image/ImageEditor.tsx
          grep -q 'generateMedia' src/components/editor/image/ImageEditor.tsx
          grep -q 'workspaceMode' src/components/editor/image/ImageEditor.tsx
          grep -q 'Motio2edit' src/components/editor/image/ImageEditor.tsx
          ! grep -q PLACEHOLDER src/components/editor/image/ImageEditor.tsx
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/components/editor/image/ImageEditor.tsx
          if git diff --cached --quiet; then echo "no changes"; exit 0; fi
          git commit -m "feat(image-studio): glass dock desktop + compact mobile Auto/Composer workspace"
          git push origin HEAD:main
