name: Apply ImageEditor glass layout
on:
  workflow_dispatch:
  push:
    paths:
      - '.restore/image_editor_layout.patch'
      - '.github/workflows/apply-image-editor-layout.yml'
concurrency:
  group: apply-image-editor-layout
  cancel-in-progress: true
jobs:
  apply:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Apply layout patch
        run: |
          set -euo pipefail
          echo "=== workspace ==="
          ls -la .restore/ || true
          test -f .restore/image_editor_layout.patch
          wc -c .restore/image_editor_layout.patch
          wc -c src/components/editor/image/ImageEditor.tsx
          # Apply even if partially applied
          patch -p1 --forward --batch -i .restore/image_editor_layout.patch || {
            echo "patch exit $? — trying fuzz"
            patch -p1 --forward --batch --fuzz=3 -i .restore/image_editor_layout.patch
          }
          BYTES=$(wc -c < src/components/editor/image/ImageEditor.tsx)
          echo "size=$BYTES"
          test "$BYTES" -gt 40000
          grep -q 'export function ImageEditor' src/components/editor/image/ImageEditor.tsx
          grep -q 'generateMedia' src/components/editor/image/ImageEditor.tsx
          grep -q 'workspaceMode' src/components/editor/image/ImageEditor.tsx
          grep -q 'Motio2edit' src/components/editor/image/ImageEditor.tsx
          ! grep -q PLACEHOLDER src/components/editor/image/ImageEditor.tsx
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/components/editor/image/ImageEditor.tsx
          if git diff --cached --quiet; then echo "no changes"; exit 0; fi
          git commit -m "feat(image-studio): glass dock desktop + compact mobile Auto/Composer workspace"
          git push origin HEAD:main
