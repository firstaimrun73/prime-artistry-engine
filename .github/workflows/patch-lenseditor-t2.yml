name: Patch LensEditor Task2
on:
  workflow_dispatch:
jobs:
  patch:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Apply Task 2 AI path
        run: |
          set -euo pipefail
          python3 << 'PY'
from pathlib import Path
p = Path("src/components/lens-camera/LensEditor.tsx")
t = p.read_text()
assert len(t) > 20000
assert "LensEditor restore incomplete" not in t
t = t.replace("  chargeLensGeneration,\n", "")
t = t.replace("  consumeAiPlusAttempt,\n", "")
old_paid = """  useEffect(() => {
    const plan =
      (user as { plan?: string } | null)?.plan ||
      (user as { subscription?: { status?: string } } | null)?.subscription?.status;
    setIsPaid(!!plan && plan !== "free");
    if (!plan || plan === "free") setWantWm(true);
  }, [user]);"""
new_paid = """  useEffect(() => {
    const plan =
      (user as { plan?: string } | null)?.plan ||
      (user as { subscription?: { status?: string } } | null)?.subscription?.status;
    const email = ((user as { email?: string } | null)?.email ?? "").toLowerCase();
    const admin = email === "firstaimrun89@gmail.com";
    setIsPaid(admin || (!!plan && plan !== "free"));
    if (!admin && (!plan || plan === "free")) setWantWm(true);
  }, [user]);"""
if old_paid in t:
    t = t.replace(old_paid, new_paid)
old_ai = '''      if (isAiLens(active)) {
        if (!isPaid) {
          throw new Error("AI+ lenses require a paid plan. Upgrade to unlock.");
        }
        setAiStage(
          active.id === "lens_farreach"
            ? "Analysing → Zooming → Enhancing"
            : active.id === "lens_hd_4k"
              ? "Analysing → Enhancing → Finishing"
              : "Analysing → Enhancing",
        );
        try {
          await consumeAiPlusAttempt({
            data: { lensId: active.id, generationId },
          });
        } catch (aiErr) {
          throw aiErr instanceof Error ? aiErr : new Error("AI+ not available");
        }
      }

      const shouldWm = wantWm && (!isPaid || active.tier === "normal");
      const processOpts = {
        watermark: shouldWm,
        maxEdge: 2560,
        zoom: active.id === "lens_farreach" ? farZoom : undefined,
        dateTimeMode,
        dateTimeStyle,
        dateTimeText:
          active.id === "lens_date_time"
            ? dateTimeTextRef.current || formatDateTimeOverlay(dateTimeMode)
            : undefined,
        colourNegative: active.id === "lens_windows_colour" ? colourNegative : undefined,
      };
      const out = applyLensOpticalEnhanced(canvas, active, "native", processOpts);
      const blob = await canvasToBlob(out, "image/jpeg", 0.96);
      const srcBlob = await canvasToBlob(canvas, "image/jpeg", 0.95);
      const srcUrl = URL.createObjectURL(srcBlob);
      const url = URL.createObjectURL(blob);

      if (active.creditCost > 0 && !isAiLens(active)) {
        try {
          const charged = await chargeLensGeneration({
            data: { lensId: active.id, generationId },
          });
          if (charged?.charged) toast.success(`${active.name} · ${charged.charged} credits`);
        } catch (chargeErr) {
          URL.revokeObjectURL(url);
          URL.revokeObjectURL(srcUrl);
          throw chargeErr instanceof Error ? chargeErr : new Error("Could not charge credits");
        }
      }

      stopCamera();
      setSourceUrl((prev) => {
        if (prev?.startsWith("blob:")) URL.revokeObjectURL(prev);
        return srcUrl;
      });
      clearResultVariants();
      resultVariantsRef.current = shouldWm ? { wm: url } : { clean: url };
      resultSourceRef.current = canvas;
      setResultWm(shouldWm);
      setResultFromUpload(fromUpload);
      setResultUrl(url);
      setPhase("result");'''
new_ai = '''      // AI+ only after capture/upload — never during live RAF preview
      if (isAiLens(active)) {
        if (!isPaid) {
          throw new Error("AI+ lenses require a paid plan. Upgrade to unlock.");
        }
        setAiStage(
          active.id === "lens_farreach"
            ? "Analysing → Zooming → Enhancing"
            : active.id === "lens_hd_4k"
              ? "Analysing → Enhancing → Finishing"
              : "Analysing → Enhancing",
        );
        const imageDataUrl = canvas.toDataURL("image/jpeg", 0.92);
        const aiResult = await runLensAiPlusGeneration({
          data: { lensId: active.id, generationId, imageDataUrl },
        });
        const outputUrl = aiResult?.outputUrl;
        if (!outputUrl || typeof outputUrl !== "string") {
          throw new Error("AI enhancement returned no image.");
        }
        if (outputUrl === imageDataUrl) {
          throw new Error("AI enhancement returned the original input.");
        }
        const srcBlob = await canvasToBlob(canvas, "image/jpeg", 0.95);
        const srcUrl = URL.createObjectURL(srcBlob);
        stopCamera();
        setSourceUrl((prev) => {
          if (prev?.startsWith("blob:")) URL.revokeObjectURL(prev);
          return srcUrl;
        });
        clearResultVariants();
        resultVariantsRef.current = { clean: outputUrl };
        resultSourceRef.current = canvas;
        setResultWm(false);
        setResultFromUpload(fromUpload);
        setResultUrl(outputUrl);
        setPhase("result");
        return;
      }

      // Common / normal lenses: local optical only, free — no credits, no FAL
      const shouldWm = wantWm && (!isPaid || active.tier === "normal");
      const processOpts = {
        watermark: shouldWm,
        maxEdge: 2560,
        zoom: active.id === "lens_farreach" ? farZoom : undefined,
        dateTimeMode,
        dateTimeStyle,
        dateTimeText:
          active.id === "lens_date_time"
            ? dateTimeTextRef.current || formatDateTimeOverlay(dateTimeMode)
            : undefined,
        colourNegative: active.id === "lens_windows_colour" ? colourNegative : undefined,
      };
      const out = applyLensOpticalEnhanced(canvas, active, "native", processOpts);
      const blob = await canvasToBlob(out, "image/jpeg", 0.96);
      const srcBlob = await canvasToBlob(canvas, "image/jpeg", 0.95);
      const srcUrl = URL.createObjectURL(srcBlob);
      const url = URL.createObjectURL(blob);

      stopCamera();
      setSourceUrl((prev) => {
        if (prev?.startsWith("blob:")) URL.revokeObjectURL(prev);
        return srcUrl;
      });
      clearResultVariants();
      resultVariantsRef.current = shouldWm ? { wm: url } : { clean: url };
      resultSourceRef.current = canvas;
      setResultWm(shouldWm);
      setResultFromUpload(fromUpload);
      setResultUrl(url);
      setPhase("result");'''
if old_ai not in t:
    raise SystemExit("AI block not found - already patched?")
t = t.replace(old_ai, new_ai)
t = t.replace('{lens.name}{isAiLens(lens) ? " · AI+" : " · 20 credits"}', '{lens.name}{isAiLens(lens) ? " · AI+" : " · Free"}')
if "chargeLensGeneration" in t or "consumeAiPlusAttempt" in t:
    raise SystemExit("still has old calls")
if "runLensAiPlusGeneration" not in t or "imageDataUrl" not in t:
    raise SystemExit("missing AI path")
p.write_text(t)
print("PATCHED", len(t))
PY
          wc -c src/components/lens-camera/LensEditor.tsx
          grep -c "runLensAiPlusGeneration\|chargeLensGeneration\|consumeAiPlusAttempt\|imageDataUrl\|· Free" src/components/lens-camera/LensEditor.tsx
      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add src/components/lens-camera/LensEditor.tsx
          git diff --cached --stat
          git commit -m "fix: finalize lens common free and ai plus entitlement"
          git push
