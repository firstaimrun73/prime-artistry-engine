name: apply-ie-chunks
on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/apply-ie-chunks.yml"
      - ".restore/ie_fix_chunk_0.txt"
      - ".restore/ie_fix_chunk_1.txt"
      - ".restore/ie_fix_chunk_2.txt"
      - ".restore/apply_ie_chunks.py"
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    concurrency:
      group: apply-ie-chunks
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 5
      - name: Apply
        run: python3 .restore/apply_ie_chunks.py
      - name: Commit
        run: |
          git config user.name "firstaimrun73"
          git config user.email "firstaimrun73@users.noreply.github.com"
          git add src/components/editor/image/ImageEditor.tsx src/lib/studio/studio-taglines-a.ts src/lib/studio/studio-taglines-b.ts
          if git diff --cached --quiet; then echo No changes; else
            git commit -m "fix(image-studio): remove duplicate preview, 2000 unique taglines, mode icons, balance, focus-stop"
            git pull --rebase origin main || true
            git push origin HEAD:main
          fi
