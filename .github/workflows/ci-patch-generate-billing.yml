name: ci-patch-generate-billing
on:
  workflow_dispatch:
  push:
    branches:
      - fix/standard-kontext-multi-billing
    paths:
      - ".restore/TRIGGER_BILLING_PATCH"
      - ".github/workflows/ci-patch-generate-billing.yml"
jobs:
  patch:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/standard-kontext-multi-billing
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Restore main baseline and apply billing patches
        run: |
          set -euo pipefail
          git fetch origin main
          git show origin/main:src/lib/generate.functions.ts > src/lib/generate.functions.ts
          BYTES=$(wc -c < src/lib/generate.functions.ts)
          echo "baseline_bytes=$BYTES"
          test "$BYTES" -gt 15000
          ! grep -q 'PLACEHOLDER\|LOADING_FROM_FILE' src/lib/generate.functions.ts
          grep -q 'export const generateMedia' src/lib/generate.functions.ts
          python3 << 'PY'
          from pathlib import Path
          p = Path("src/lib/generate.functions.ts")
          t = p.read_text()
          assert len(t.encode()) > 15000
          assert "export const generateMedia" in t
          assert "PLACEHOLDER" not in t
          old_vars = "    let cost = 0;\n    let reservedVideoQuote: GenerationQuote | null = null;"
          new_vars = old_vars + "\n    let imageReservationTxId: string | null = null;"
          if "let imageReservationTxId" not in t:
              if old_vars not in t:
                  raise SystemExit("PRECONDITION FAIL: vars block")
              t = t.replace(old_vars, new_vars, 1)
          old_debit = (
              "        if (!isAdmin && cost > 0) {\n"
              "          const { error: debitErr } = await supabase.rpc(\"debit_credits\", {\n"
              "            p_user_id: userId,\n"
              "            p_amount: cost,\n"
              "          });\n"
              "          if (debitErr) throw new Error(debitErr.message || \"Credit debit failed\");\n"
              "        }"
          )
          new_debit = (
              "        if (!isAdmin && cost > 0) {\n"
              "          const { supabaseAdmin } = await import(\"@/integrations/supabase/client.server\");\n"
              "          const genType = data.type === \"video\" ? \"video\" : \"image\";\n"
              "          const { data: debitData, error: debitErr } = await supabaseAdmin.rpc(\"deduct_credits\", {\n"
              "            _amount: cost,\n"
              "            _gen_type: genType,\n"
              "            _user_id: userId,\n"
              "          });\n"
              "          if (debitErr) throw new Error(debitErr.message || \"Credit debit failed\");\n"
              "          const txId =\n"
              "            debitData && typeof debitData === \"object\" && \"transaction_id\" in (debitData as object)\n"
              "              ? String((debitData as { transaction_id?: unknown }).transaction_id || \"\")\n"
              "              : \"\";\n"
              "          if (!txId) throw new Error(\"Credit debit did not return a transaction_id\");\n"
              "          imageReservationTxId = txId;\n"
              "        }"
          )
          if "debit_credits" in t:
              if old_debit not in t:
                  raise SystemExit("PRECONDITION FAIL: debit block")
              t = t.replace(old_debit, new_debit, 1)
          old_catch = (
              "    } catch (err) {\n"
              "      if (reservedVideoQuote) {\n"
              "        try {\n"
              "          await releaseReservation(supabase, reservedVideoQuote);\n"
              "          markFailed(reservedVideoQuote);\n"
              "        } catch {\n"
              "          /* ignore */\n"
              "        }\n"
              "      }\n"
              "      throw err;\n"
              "    }"
          )
          new_catch = (
              "    } catch (err) {\n"
              "      if (reservedVideoQuote) {\n"
              "        try {\n"
              "          await releaseReservation(supabase, reservedVideoQuote);\n"
              "          markFailed(reservedVideoQuote);\n"
              "        } catch {\n"
              "          /* ignore */\n"
              "        }\n"
              "      }\n"
              "      if (imageReservationTxId) {\n"
              "        try {\n"
              "          const { supabaseAdmin } = await import(\"@/integrations/supabase/client.server\");\n"
              "          const { error: refundErr } = await supabaseAdmin.rpc(\"refund_credits\", {\n"
              "            _transaction_id: imageReservationTxId,\n"
              "            _user_id: userId,\n"
              "          });\n"
              "          if (refundErr) {\n"
              "            console.error(\"[generate] CRITICAL image refund_credits failed\", refundErr.message);\n"
              "          }\n"
              "        } catch (refundThrow) {\n"
              "          console.error(\"[generate] CRITICAL image refund_credits threw\", refundThrow);\n"
              "        }\n"
              "      }\n"
              "      throw err;\n"
              "    }"
          )
          if "refund_credits" not in t:
              if old_catch not in t:
                  raise SystemExit("PRECONDITION FAIL: catch block")
              t = t.replace(old_catch, new_catch, 1)
          old_std = (
              "          const result = await executeStandardImage(standardRequest, { falKey });\n"
              "          outputUrl = result.outputUrl;\n"
              "          providerSourceUrl = outputUrl;"
          )
          new_std = (
              "          const result = await executeStandardImage(standardRequest, { falKey });\n"
              "          outputUrl = result.outputUrl;\n"
              "          if (data.imageUrl && outputUrl === data.imageUrl) {\n"
              "            throw new Error(\"Image edit returned the original image unchanged. Credits will be refunded.\");\n"
              "          }\n"
              "          providerSourceUrl = outputUrl;"
          )
          if "Image edit returned the original image unchanged" not in t:
              if old_std not in t:
                  raise SystemExit("PRECONDITION FAIL: standard execute block")
              t = t.replace(old_std, new_std, 1)
          if "debit_credits" in t:
              raise SystemExit("POSTCONDITION FAIL: debit_credits remains")
          if "deduct_credits" not in t or "refund_credits" not in t:
              raise SystemExit("POSTCONDITION FAIL: missing deduct/refund")
          if "PLACEHOLDER" in t or "LOADING_FROM_FILE" in t:
              raise SystemExit("POSTCONDITION FAIL: placeholder")
          if len(t.encode()) < 18000:
              raise SystemExit(f"POSTCONDITION FAIL: size {len(t.encode())}")
          p.write_text(t)
          print("patched_ok", len(t.encode()))
          PY
      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/lib/generate.functions.ts
          if git diff --cached --quiet; then echo "no changes"; exit 0; fi
          git commit -m "fix(billing): deduct_credits + refund on failure; reject unchanged image"
          git push origin HEAD:fix/standard-kontext-multi-billing
