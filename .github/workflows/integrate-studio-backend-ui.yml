name: integrate-studio-backend-ui
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/integrate-studio-backend-ui.yml'
      - '.restore/integrate_chunk_*.b64'
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    concurrency:
      group: integrate-studio-backend-ui
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 5
      - name: Apply integration patch
        run: |
          set -euo pipefail
          python3 << 'PY'
          import base64, pathlib, glob
          parts = sorted(glob.glob('.restore/integrate_chunk_*.b64'))
          assert parts, 'missing integrate chunks'
          b64 = ''.join(pathlib.Path(p).read_text().strip() for p in parts)
          pathlib.Path('/tmp/integrate_patch.py').write_bytes(base64.b64decode(b64))
          print('assembled', len(b64))
          PY
          python3 /tmp/integrate_patch.py
          grep -q 'FAL auth context' src/lib/generate.functions.ts
          grep -q 'Create the world of your own thoughts' src/lib/studio/studio-taglines-a.ts
          grep -q 'font-bold' src/components/editor/image/InspirationTagline.tsx
          grep -q 'useServerFn(generateMedia)' src/components/editor/image/ImageEditor.tsx
          grep -q 'imageUrl: mediaUrl' src/components/editor/image/ImageEditor.tsx
          echo VERIFY_OK
      - name: Commit
        run: |
          git config user.name "firstaimrun73"
          git config user.email "firstaimrun73@users.noreply.github.com"
          git add src/lib/generate.functions.ts \
                  src/components/editor/image/ImageEditor.tsx \
                  src/components/editor/image/InspirationTagline.tsx \
                  src/components/editor/EditorUpload.tsx \
                  src/lib/studio/studio-taglines-a.ts \
                  src/lib/studio/studio-taglines-b.ts
          if git diff --cached --quiet; then echo No changes; else
            git commit -m "fix(image-studio): normalize FAL env at runtime (no key rotation); 200+ quality taglines; centered empty workspace; keep generateMedia pipeline"
            git pull --rebase origin main || true
            git push origin HEAD:main
          fi
