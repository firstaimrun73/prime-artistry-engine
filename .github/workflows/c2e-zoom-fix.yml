name: c2e-zoom-fix
on:
  workflow_dispatch:
  push:
    paths: ['.github/workflows/c2e-zoom-fix.yml']
jobs:
  fix:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          python3 << 'PY'
          from pathlib import Path
          p = Path("src/components/circle-edit/CircleMaskStage.tsx")
          t = p.read_text()
          assert "SEE_" not in t and "PLACEHOLDER" not in t

          # 1) Keep userZoom in a ref so layoutCanvas identity is stable
          if "userZoomRef" not in t:
            t = t.replace(
              "const [userZoom, setUserZoom] = useState(1);",
              "const [userZoom, setUserZoom] = useState(1);\n  const userZoomRef = useRef(1);\n  userZoomRef.current = userZoom;",
            )

          # 2) layoutCanvas reads userZoomRef, not userZoom state — drop userZoom from deps
          t = t.replace(
              "const z = Math.min(3, Math.max(0.5, userZoom));",
              "const z = Math.min(3, Math.max(0.5, userZoomRef.current));",
          )
          t = t.replace(
              "}, [redraw, userZoom]);",
              "}, [redraw]);",
          )

          # 3) Image-load effect must ONLY depend on imageUrl — layoutCanvas in deps
          #    recreated the effect and reset setUserZoom(1) on every zoom click.
          old_img = """  useEffect(() => {
    let cancelled = false;
    if (flashTimerRef.current != null) {
      window.clearTimeout(flashTimerRef.current);
      flashTimerRef.current = null;
    }
    const img = new Image();
    img.crossOrigin = "anonymous";
    img.onload = () => {
      if (cancelled) return;
      imgRef.current = img;
      const nat: Size = { width: img.naturalWidth, height: img.naturalHeight };
      maskRef.current = createWorkingMask(nat);
      historyRef.current = { past: [], future: [] };
      setNatural(nat);
      setAspect(nat.width / Math.max(1, nat.height));
      setReady(true);
      setLivePath([]);
      setNearClose(false);
      setFlashOrigin(null);
      setUserZoom(1);
      requestAnimationFrame(() => {
        layoutCanvas();
        notify();
      });
    };
    img.onerror = () => {
      if (!cancelled) setReady(false);
    };
    img.src = imageUrl;
    return () => {
      cancelled = true;
    };
  }, [imageUrl, layoutCanvas, notify]);"""

          new_img = """  useEffect(() => {
    let cancelled = false;
    if (flashTimerRef.current != null) {
      window.clearTimeout(flashTimerRef.current);
      flashTimerRef.current = null;
    }
    const img = new Image();
    img.crossOrigin = "anonymous";
    img.onload = () => {
      if (cancelled) return;
      imgRef.current = img;
      const nat: Size = { width: img.naturalWidth, height: img.naturalHeight };
      maskRef.current = createWorkingMask(nat);
      historyRef.current = { past: [], future: [] };
      setNatural(nat);
      setAspect(nat.width / Math.max(1, nat.height));
      setReady(true);
      setLivePath([]);
      setNearClose(false);
      setFlashOrigin(null);
      setUserZoom(1);
      userZoomRef.current = 1;
      requestAnimationFrame(() => {
        layoutCanvas();
        notify();
      });
    };
    img.onerror = () => {
      if (!cancelled) setReady(false);
    };
    img.src = imageUrl;
    return () => {
      cancelled = true;
    };
    // imageUrl only — do NOT depend on layoutCanvas/notify or zoom resets on every +/-
    // eslint-disable-next-line react-hooks/exhaustive-deps
  }, [imageUrl]);"""

          if old_img not in t:
              raise SystemExit("image effect block not found")
          t = t.replace(old_img, new_img)

          # 4) Remove maxWidth/maxHeight 100% which clamped zoomed CSS size back to container
          t = t.replace(
              """          style={{
            display: "block",
            maxWidth: "100%",
            maxHeight: "100%",
            width: displaySize.w ? `${displaySize.w}px` : "auto",
            height: displaySize.h ? `${displaySize.h}px` : "auto",
            objectFit: "contain",
            imageRendering: "auto",
            aspectRatio: aspect ? String(aspect) : undefined,
          }}""",
              """          style={{
            display: "block",
            width: displaySize.w ? `${displaySize.w}px` : "auto",
            height: displaySize.h ? `${displaySize.h}px` : "auto",
            objectFit: "contain",
            imageRendering: "auto",
            aspectRatio: aspect ? String(aspect) : undefined,
          }}""",
          )

          # 5) Allow pan when zoomed (overflow auto) instead of hard-clip
          t = t.replace(
              'className="relative flex h-full min-h-0 w-full flex-1 items-center justify-center overflow-hidden"',
              'className={`relative flex h-full min-h-0 w-full flex-1 items-center justify-center ${userZoom > 1 ? "overflow-auto" : "overflow-hidden"}`}',
          )

          # 6) Zoom buttons: also write userZoomRef immediately for sync layout
          t = t.replace(
              "onClick={() => setUserZoom((z) => Math.min(3, Math.round((z + 0.25) * 100) / 100))}",
              "onClick={() => { setUserZoom((z) => { const n = Math.min(3, Math.round((z + 0.25) * 100) / 100); userZoomRef.current = n; return n; }); }}",
          )
          t = t.replace(
              "onClick={() => setUserZoom((z) => Math.max(0.5, Math.round((z - 0.25) * 100) / 100))}",
              "onClick={() => { setUserZoom((z) => { const n = Math.max(0.5, Math.round((z - 0.25) * 100) / 100); userZoomRef.current = n; return n; }); }}",
          )

          p.write_text(t)
          assert "userZoomRef" in t
          assert "[imageUrl, layoutCanvas, notify]" not in t
          assert "maxWidth: \"100%\"" not in t
          print("zoom fix ok", len(t))
          PY
          git add src/components/circle-edit/CircleMaskStage.tsx
          git commit -m "fix(circle2edit): zoom +/− actually scale canvas (stop image-effect reset)"
          git pull --rebase origin main || true
          git push
          git rev-parse HEAD
