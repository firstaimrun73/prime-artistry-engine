name: c2e-zoom-fix
on:
  workflow_dispatch:
  push:
    paths: ['.github/workflows/c2e-zoom-fix.yml']
jobs:
  fix:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          python3 << 'PY'
          from pathlib import Path
          p = Path("src/components/circle-edit/CircleMaskStage.tsx")
          t = p.read_text()
          assert "SEE_" not in t and "PLACEHOLDER" not in t and "LOADING" not in t

          if "userZoomRef" not in t:
            t = t.replace(
              "const [userZoom, setUserZoom] = useState(1);",
              "const [userZoom, setUserZoom] = useState(1);\n  const userZoomRef = useRef(1);\n  userZoomRef.current = userZoom;",
            )

          t = t.replace(
              "const z = Math.min(3, Math.max(0.5, userZoom));",
              "const z = Math.min(3, Math.max(0.5, userZoomRef.current));",
          )
          t = t.replace(
              "}, [redraw, userZoom]);",
              "}, [redraw]);",
          )

          old_img_end = "  }, [imageUrl, layoutCanvas, notify]);"
          new_img_end = "  }, [imageUrl]); // zoom-safe: do not re-run load on layoutCanvas"
          if old_img_end in t:
              t = t.replace(old_img_end, new_img_end)
          elif "}, [imageUrl]);" not in t and "zoom-safe" not in t:
              raise SystemExit("could not fix image load deps")

          # maxWidth clamp
          t = t.replace("\n            maxWidth: \"100%\",", "")
          t = t.replace("\n            maxHeight: \"100%\",", "")

          # zoom buttons write ref
          t = t.replace(
              "onClick={() => setUserZoom((z) => Math.min(3, Math.round((z + 0.25) * 100) / 100))}",
              "onClick={() => { setUserZoom((z) => { const n = Math.min(3, Math.round((z + 0.25) * 100) / 100); userZoomRef.current = n; return n; }); }}",
          )
          t = t.replace(
              "onClick={() => setUserZoom((z) => Math.max(0.5, Math.round((z - 0.25) * 100) / 100))}",
              "onClick={() => { setUserZoom((z) => { const n = Math.max(0.5, Math.round((z - 0.25) * 100) / 100); userZoomRef.current = n; return n; }); }}",
          )

          p.write_text(t)
          assert "userZoomRef" in t
          assert "[imageUrl, layoutCanvas, notify]" not in t
          print("zoom ok")

          # Route: remove ?, chip bottom
          r = Path("src/routes/studio.image.circle-remove.tsx")
          rt = r.read_text()
          lines = [ln for ln in rt.splitlines(True) if "CircleHowToHelp" not in ln]
          rt = "".join(lines)
          rt = rt.replace("inset-x-0 top-2", "inset-x-0 bottom-14")
          rt = rt.replace("left-0 right-0 top-0 z-20 flex justify-center px-3 pt-2", "inset-x-0 bottom-14 z-20 flex justify-center px-3")
          # fix broken help row wrappers left over
          rt = rt.replace(' data-circle-help-row="true"', "")
          r.write_text(rt)

          # About credits + copy
          a = Path("src/routes/about.tsx")
          at = a.read_text()
          at = at.replace('["Standard", String(STANDARD_CREDITS)]', '["Standard (T2I SD/HD)", `${STANDARD_CREDITS.textToImageSd} / ${STANDARD_CREDITS.textToImageHd}`]')
          at = at.replace('["Premium", String(PREMIUM_T2I_CREDITS)]', '["Premium (T2I SD/HD/2K)", `${PREMIUM_T2I_CREDITS.sd} / ${PREMIUM_T2I_CREDITS.hd} / ${PREMIUM_T2I_CREDITS["2k"]}`]')
          at = at.replace('["Ultra", String(ULTRA_T2I_CREDITS)]', '["Ultra (T2I SD/HD/2K/4K)", `${ULTRA_T2I_CREDITS.sd} / ${ULTRA_T2I_CREDITS.hd} / ${ULTRA_T2I_CREDITS["2k"]} / ${ULTRA_T2I_CREDITS["4k"]}`]')
          old = "Circle regions to remove distractions or add objects that match the scene. Remove is fast for clean-up;\n            Add places new elements with lighting and perspective matched to the photo."
          new = "Circle 2edit lets you remove unwanted objects from a photo or add new ones that blend naturally into the scene. Upload any photo, mark the region with Circle or Brush (use Zoom for fine detail), then Remove to rebuild the background or Add to place a library object. The Motion2Ai engine matches lighting and perspective. Add costs more because it generates new content scaled to your photo resolution."
          if old in at:
              at = at.replace(old, new)
          oldv = "Video Studio turns text or still images into short cinematic clips. Describe the scene or upload a\n            reference, pick duration and aspect, then generate. Clips are suited to social and concept\n            previews; longer timelines and advanced audio tools continue to expand with the product."
          newv = "Video Studio turns a written idea or a still photo into a short AI-generated video clip. Text-to-Video describes a scene; Image-to-Video animates a still; Video-to-Video restyles a clip while keeping motion. Choose duration, aspect (9:16, 1:1, 4:5, or 16:9), quality, and optional sound, then preview before download."
          if oldv in at:
              at = at.replace(oldv, newv)
          a.write_text(at)
          assert "textToImageSd" in at
          print("all ok")
          PY
          grep -q userZoomRef src/components/circle-edit/CircleMaskStage.tsx
          grep -q zoom-safe src/components/circle-edit/CircleMaskStage.tsx
          ! grep -q CircleHowToHelp src/routes/studio.image.circle-remove.tsx || true
          grep -q textToImageSd src/routes/about.tsx
          git add src/components/circle-edit/CircleMaskStage.tsx src/routes/studio.image.circle-remove.tsx src/routes/about.tsx
          if git diff --cached --quiet; then echo nothing; else
            git commit -m "fix: zoom root-cause; remove ?; chip bottom; about credits numbers + copy"
            git push origin HEAD:main
          fi
          git rev-parse HEAD
