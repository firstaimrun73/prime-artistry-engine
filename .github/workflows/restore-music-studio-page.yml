name: restore-music-studio-page
on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/restore-music-studio-page.yml"
jobs:
  restore:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Fetch known-good page and apply admin-only + duration locks
        run: |
          set -euo pipefail
          curl -fsSL "https://raw.githubusercontent.com/firstaimrun73/prime-artistry-engine/2061f1f3b02617248d0a8288371de0b0ec3bb026/src/components/music/MusicStudioPage.tsx" \
            -o src/components/music/MusicStudioPage.tsx
          python3 <<'PY'
          from pathlib import Path
          p = Path("src/components/music/MusicStudioPage.tsx")
          t = p.read_text()
          assert "MusicStudioPage" in t and "PLACEHOLDER" not in t

          # Lock import
          if "Lock" not in t:
              t = t.replace(
                  'from "lucide-react";',
                  'from "lucide-react";\n// Lock icon for plan-gated chips',
              )
              t = t.replace("Music2, Coins", "Music2, Coins, Lock")
              t = t.replace("Coins, X, Music2", "Coins, X, Music2, Lock")
              t = t.replace("Music2 } from", "Music2, Lock } from")
              if ", Lock" not in t and " Lock," not in t:
                  t = t.replace(
                      "Sparkles, Loader2, Mic2, Video, ImagePlus, Coins, X, Music2",
                      "Sparkles, Loader2, Mic2, Video, ImagePlus, Coins, X, Music2, Lock",
                  )

          # Admin-only: never pass adminTestPlan for non-admin
          t = t.replace(
              "adminTestPlan: adminTestPlan ?? undefined",
              "adminTestPlan: isAdmin ? (adminTestPlan ?? undefined) : undefined",
          )
          t = t.replace(
              "adminTestPlan: adminTestPlan ?? undefined",
              "adminTestPlan: isAdmin ? (adminTestPlan ?? undefined) : undefined",
          )

          # Double-gate panel
          if "isAdminEmail(profile.email)" not in t:
              t = t.replace(
                  "{isAdmin && (",
                  "{isAdmin && profile?.email && isAdminEmail(profile.email) && (",
              )

          # Duration locks
          if "Upgrade to unlock" not in t:
              needle = '(mode === "sfx" || mode === "video_music" ? SFX_DURATIONS : DURATIONS).map((d) => ('
              if needle in t:
                  t = t.replace(
                      needle,
                      '(mode === "sfx" || mode === "video_music" ? SFX_DURATIONS : DURATIONS).map((d) => {\n                    const maxAllowed = !musicCaps ? d.s : mode === "sfx" ? musicCaps.maxSfxDurationSeconds : mode === "video_music" ? musicCaps.maxVideoAudioDurationSeconds : musicCaps.maxTrackDurationSeconds;\n                    const locked = maxAllowed > 0 && d.s > maxAllowed;\n                    return (',
                      1,
                  )
                  t = t.replace(
                      'onClick={() => setDuration(d.s)}',
                      'disabled={locked} title={locked ? `Upgrade to unlock ${d.label}` : undefined} onClick={() => { if (!locked) setDuration(d.s); }}',
                      1,
                  )
                  t = t.replace(
                      'duration === d.s ? "border-transparent bg-gradient-to-r from-orange-500 to-purple-600 text-white shadow-sm" : "border-border/60 bg-card text-muted-foreground hover:border-orange-500/40")}>\n                      {d.label}\n                    </button>\n                  ))}',
                      'locked && "cursor-not-allowed opacity-45", !locked && duration === d.s ? "border-transparent bg-gradient-to-r from-orange-500 to-purple-600 text-white shadow-sm" : !locked ? "border-border/60 bg-card text-muted-foreground hover:border-orange-500/40" : "border-border/40 bg-card/60 text-muted-foreground")}>{locked ? (<span className="inline-flex items-center gap-1"><Lock className="h-3 w-3" />{d.label}</span>) : d.label}</button>);})}',
                      1,
                  )

          p.write_text(t)
          print("ok", len(t), "locks", "Upgrade to unlock" in t, "admin", t.count("isAdminEmail"))
          PY
      - name: Commit and push
        run: |
          git config user.name "music-restore"
          git config user.email "restore@motio2edit.local"
          git add src/components/music/MusicStudioPage.tsx
          if git diff --cached --quiet; then echo nochange; exit 0; fi
          git commit -m "fix(music): restore MusicStudioPage — admin-only panel + locked durations"
          git pull --rebase origin main || git pull --rebase --autostash origin main || true
          git push origin HEAD:main
