name: Apply Image Studio entitlement and layout fix
on:
  workflow_dispatch:
  push:
    paths:
      - '.restore/ie_c*.txt'
      - '.restore/gen_c*.txt'
      - '.restore/ie_n.txt'
      - '.restore/gen_n.txt'
      - '.restore/apply_image_studio_fix.py'
      - '.github/workflows/apply-image-studio-fix.yml'
concurrency:
  group: apply-image-studio-fix
  cancel-in-progress: false
jobs:
  apply:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Apply package
        run: |
          set -euo pipefail
          ls -la .restore/ie_c*.txt .restore/gen_c*.txt
          python3 .restore/apply_image_studio_fix.py
          test $(wc -c < src/components/editor/image/ImageEditor.tsx) -gt 40000
          grep -q canAccessImageExperience src/components/editor/image/ImageEditor.tsx
          grep -q References src/components/editor/image/ImageEditor.tsx
          grep -q Avatar src/components/editor/image/ImageEditor.tsx
          grep -q assertImageExperienceAccess src/lib/generate.functions.ts
          grep -q 'return 9' src/lib/studio/studio-tier.ts
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/components/editor/image/ImageEditor.tsx src/lib/generate.functions.ts src/lib/studio/studio-tier.ts
          if git diff --cached --quiet; then echo no changes; exit 0; fi
          git commit -m "fix(image-studio): free-plan locks, Ultra 9 refs, compact workspace, header avatar"
          git push origin HEAD:main
