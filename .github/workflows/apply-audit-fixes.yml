name: Apply production audit fixes
on:
  workflow_dispatch: {}
  push:
    paths:
      - ".github/scripts/patch_audit_fixes.py"
permissions:
  contents: write
concurrency:
  group: apply-audit-fixes
  cancel-in-progress: false
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0
      - name: Apply patches
        run: python3 .github/scripts/patch_audit_fixes.py
      - name: Verify markers
        run: |
          set -e
          grep -n "fetchWithDeadline\|referenceImageUrls\|assertSafeMediaUrl" src/lib/generate.functions.ts | head -20
          grep -n "90_000\|fetchWithDeadline\|safe-external-url" src/lib/music.functions.ts | head -15
          test -f src/lib/safe-external-url.ts
          grep -n "fetchWithDeadline" src/lib/studio/image/standard/fal-client.ts | head -10
      - name: Commit
        run: |
          set -e
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/lib/generate.functions.ts src/lib/music.functions.ts src/lib/studio/image/standard/fal-client.ts src/lib/safe-external-url.ts src/lib/safe-external-url.test.ts
          if git diff --cached --quiet; then
            echo No changes
          else
            git commit -m "fix(security): ref limit parity, AbortController FAL/music polls, SSRF URL guards"
            git pull --rebase origin main || true
            git push origin HEAD:main
          fi
