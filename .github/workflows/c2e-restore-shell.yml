name: c2e-restore-shell
on:
  workflow_dispatch:
  push:
    paths: ['.github/workflows/c2e-restore-shell.yml']
jobs:
  fix:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          GOOD=78683d84f517e774a63244128a03402d9c510ebc
          git show "$GOOD:src/components/circle-edit/CircleEditShell.tsx" > src/components/circle-edit/CircleEditShell.tsx
          # minimal lock icon via sed
          sed -i 's/ArrowLeft, Info, Upload, X, Sparkles/ArrowLeft, Info, Upload, X, Sparkles, Lock/' src/components/circle-edit/CircleEditShell.tsx
          sed -i 's/locked ? "Add locked" : "Add"/locked ? (<span className="inline-flex items-center gap-1"><Lock className="h-3 w-3" aria-hidden \/><span>Add<\/span><\/span>) : "Add"/' src/components/circle-edit/CircleEditShell.tsx
          # verify not stub
          test "$(wc -c < src/components/circle-edit/CircleEditShell.tsx)" -gt 10000
          grep -q 'export function CircleEditShell' src/components/circle-edit/CircleEditShell.tsx
          grep -q Lock src/components/circle-edit/CircleEditShell.tsx
          # ensure mask stage still good
          grep -q destination-in src/components/circle-edit/CircleMaskStage.tsx || git show 500ff7fe222c2c951e86d89cd849bfb333173430:src/components/circle-edit/CircleMaskStage.tsx > src/components/circle-edit/CircleMaskStage.tsx
          git add src/components/circle-edit/CircleEditShell.tsx src/components/circle-edit/CircleMaskStage.tsx
          git commit -m "fix(circle2edit): restore shell + lock icon; keep mask tint zoom fixes"
          git pull --rebase origin main || true
          git push
          git rev-parse HEAD
