name: fix-image-studio-restore-apply
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/fix-image-studio-restore-apply.yml'
jobs:
  apply:
    runs-on: ubuntu-latest
    concurrency:
      group: fix-image-studio-restore
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 20
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Restore pre-placeholder files then apply surgical fixes
        run: |
          set -euo pipefail
          git show ee55c88c192578cb6d63e74ab492bb9df3090581:src/lib/studio/studio-tier.ts > src/lib/studio/studio-tier.ts
          git show ee55c88c192578cb6d63e74ab492bb9df3090581:src/lib/generate.functions.ts > src/lib/generate.functions.ts
          git show ee55c88c192578cb6d63e74ab492bb9df3090581:src/components/editor/image/ImageEditor.tsx > src/components/editor/image/ImageEditor.tsx
          python3 .restore/apply_surgical_image_studio.py
          python3 << 'PY'
from pathlib import Path
ie = Path("src/components/editor/image/ImageEditor.tsx").read_text()
if "const avatarSrc = resolveAvatarSrc" not in ie:
    needle = '  const isFreePlanForWm = (profile?.plan ?? "free") === "free";'
    if needle in ie:
        inject = needle + '\n  const avatarSrc = resolveAvatarSrc(profile?.avatar_url, profile?.avatar_signed_url, {\n    userId: profile?.id,\n    nameOrEmail: profile?.display_name || profile?.email,\n  });\n  const avatarInitial = (profile?.display_name || profile?.email || "U").trim().charAt(0).toUpperCase() || "U";'
        ie = ie.replace(needle, inject, 1)
if 'from "@/components/ui/avatar"' not in ie:
    ie = ie.replace(
        'import { StudioBackLink } from "@/components/StudioBackLink";',
        'import { StudioBackLink } from "@/components/StudioBackLink";\nimport { resolveAvatarSrc } from "@/lib/avatar-presets";\nimport { Avatar, AvatarFallback, AvatarImage } from "@/components/ui/avatar";',
    )
if 'aria-label="Open dashboard"' not in ie:
    old = '''            {!isAdmin && (
              <span className="shrink-0 rounded-full border border-border/50 bg-card/50 px-2 py-0.5 text-xs font-medium tabular-nums text-muted-foreground backdrop-blur-sm">
                {profile.credits} credits
              </span>
            )}
          </header>'''
    new = '''            <div className="flex shrink-0 items-center gap-2">
              {!isAdmin && (
                <span className="rounded-full border border-border/50 bg-card/50 px-2 py-0.5 text-xs font-medium tabular-nums text-muted-foreground backdrop-blur-sm">
                  {profile?.credits ?? 0} credits
                </span>
              )}
              <button
                type="button"
                onClick={() => { window.location.href = "/dashboard"; }}
                className="shrink-0 rounded-full focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-[#FF5A1F]/50"
                aria-label="Open dashboard"
              >
                <Avatar className="h-8 w-8 border border-border/60 sm:h-9 sm:w-9">
                  <AvatarImage src={avatarSrc} alt="" />
                  <AvatarFallback className="bg-[#FF5A1F]/15 text-xs font-semibold text-[#FF5A1F]">
                    {avatarInitial}
                  </AvatarFallback>
                </Avatar>
              </button>
            </div>
          </header>'''
    if old in ie:
        ie = ie.replace(old, new, 1)
for a,b in [
    ('max-h-[min(28vh,240px)]','max-h-[min(12vh,110px)]'),
    ('max-h-[min(34vh,320px)]','max-h-[min(14vh,120px)]'),
    ('max-h-[min(48vh,480px)]','max-h-[min(16vh,140px)]'),
    ('max-h-[min(18vh,160px)]','max-h-[min(12vh,110px)]'),
    ('max-h-[min(20vh,180px)]','max-h-[min(14vh,120px)]'),
    ('max-h-[min(22vh,200px)]','max-h-[min(14vh,130px)]'),
    ('max-h-[min(28vh,260px)]','max-h-[min(16vh,140px)]'),
]:
    ie = ie.replace(a,b)
ie = ie.replace(
    '{/* DISPLAY */}\n            <section className="flex min-h-0 min-w-0 flex-col overflow-hidden rounded-2xl border border-border/40 bg-card/40 shadow-sm backdrop-blur-xl">',
    '{/* REFERENCES — compact strip (no large empty display) */}\n            <section className="flex min-h-0 min-w-0 shrink-0 flex-col overflow-hidden rounded-2xl border border-border/40 bg-card/40 shadow-sm backdrop-blur-xl lg:min-h-0 lg:flex-1">',
)
ie = ie.replace(
    'className="flex min-h-0 flex-1 items-center justify-center p-2 sm:p-3"',
    'className="flex shrink-0 items-center justify-center p-1.5 sm:p-2"',
)
ie = ie.replace(
    "Upload references from the Display strip. Charge updates with experience and quality.",
    "Add up to the experience limit as references. Charge updates with experience and quality.",
)
if ie.count('{') != ie.count('}'):
    raise SystemExit('brace mismatch')
Path("src/components/editor/image/ImageEditor.tsx").write_text(ie)
print('ImageEditor extra OK', len(ie))
PY
          grep -q 'return 9' src/lib/studio/studio-tier.ts
          grep -q 'assertImageExperienceAccess' src/lib/generate.functions.ts
          grep -q 'Upgrade</span>' src/components/editor/image/ImageEditor.tsx
          grep -q 'Open dashboard' src/components/editor/image/ImageEditor.tsx
          test "$(wc -c < src/components/editor/image/ImageEditor.tsx)" -gt 40000
          echo VERIFY_OK
      - name: Commit and push
        run: |
          git config user.name "firstaimrun73"
          git config user.email "firstaimrun73@users.noreply.github.com"
          git add src/lib/studio/studio-tier.ts src/lib/generate.functions.ts src/components/editor/image/ImageEditor.tsx
          git status
          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -m "fix(image-studio): free-plan locks, server assert, Ultra 9 refs, avatar header, compact workspace"
            git push origin HEAD:main
          fi
