name: Apply Circle2edit critical bugfixes
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/apply-circle-bugfixes.yml'
concurrency:
  group: apply-circle-bugfixes
  cancel-in-progress: true
jobs:
  apply:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Write fixed files from embedded base64
        env:
          MASK_B64: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          # Files are pulled from the previous good commit paths and patched inline in the next step
          true
      - name: Patch CircleMaskStage + Shell + route
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          python3 << 'PY'
          from pathlib import Path

          # --- CircleMaskStage ---
          p = Path("src/components/circle-edit/CircleMaskStage.tsx")
          t = p.read_text()

          old_redraw = '''  const redraw = useCallback(() => {
    const canvas = canvasRef.current;
    const img = imgRef.current;
    const mask = maskRef.current;
    if (!canvas || !img || !mask) return;
    const ctx = canvas.getContext("2d");
    if (!ctx) return;
    const w = canvas.width;
    const h = canvas.height;
    ctx.clearRect(0, 0, w, h);
    ctx.drawImage(img, 0, 0, w, h);
    // Tint mask overlay with active ink colour (persists across tools/undo)
    ctx.save();
    ctx.globalAlpha = 0.42;
    ctx.drawImage(mask.canvas, 0, 0, w, h);
    ctx.globalCompositeOperation = "source-atop";
    ctx.globalAlpha = 0.55;
    ctx.fillStyle = inkStroke;
    ctx.fillRect(0, 0, w, h);
    ctx.restore();
  }, [inkStroke]);'''

          new_redraw = '''  const redraw = useCallback(() => {
    const canvas = canvasRef.current;
    const img = imgRef.current;
    const mask = maskRef.current;
    if (!canvas || !img || !mask) return;
    const ctx = canvas.getContext("2d");
    if (!ctx) return;
    const w = canvas.width;
    const h = canvas.height;
    ctx.clearRect(0, 0, w, h);
    ctx.drawImage(img, 0, 0, w, h);
    // Tint ONLY painted mask pixels with the active ink colour.
    const tint = document.createElement("canvas");
    tint.width = w;
    tint.height = h;
    const tctx = tint.getContext("2d");
    if (tctx) {
      tctx.fillStyle = inkStroke;
      tctx.fillRect(0, 0, w, h);
      tctx.globalCompositeOperation = "destination-in";
      tctx.drawImage(mask.canvas, 0, 0, w, h);
      ctx.save();
      ctx.globalAlpha = 0.55;
      ctx.drawImage(tint, 0, 0);
      ctx.restore();
    }
  }, [inkStroke]);'''

          if old_redraw not in t:
              raise SystemExit("redraw block missing")
          t = t.replace(old_redraw, new_redraw)

          old_ro = '''  useEffect(() => {
    if (!ready) return;
    const shell = shellRef.current;
    if (!shell) return;
    const ro = new ResizeObserver(() => layoutCanvas());
    ro.observe(shell);
    window.addEventListener("resize", layoutCanvas);
    return () => {
      ro.disconnect();
      window.removeEventListener("resize", layoutCanvas);
    };
  }, [layoutCanvas, ready]);'''

          new_ro = old_ro + '''

  // Apply zoom immediately when +/- is tapped (ResizeObserver alone does not fire on zoom state).
  useEffect(() => {
    if (!ready) return;
    layoutCanvas();
  }, [userZoom, ready, layoutCanvas]);'''

          if old_ro not in t:
              raise SystemExit("resize effect missing")
          t = t.replace(old_ro, new_ro)

          old_zoom = '''        {/* Zoom controls */}
        <div className="absolute bottom-2 right-2 z-20 flex flex-col gap-1.5">
          <button
            type="button"
            aria-label="Zoom in"
            onClick={() => setUserZoom((z) => Math.min(3, Math.round((z + 0.25) * 100) / 100))}
            className="grid h-9 w-9 place-items-center rounded-xl border border-white/20 bg-black/50 text-sm font-bold text-white backdrop-blur-md"
          >
            +
          </button>
          <button
            type="button"
            aria-label="Zoom out"
            onClick={() => setUserZoom((z) => Math.max(0.5, Math.round((z - 0.25) * 100) / 100))}
            className="grid h-9 w-9 place-items-center rounded-xl border border-white/20 bg-black/50 text-sm font-bold text-white backdrop-blur-md"
          >
            −
          </button>
        </div>
        {/* Glass touch ripple */}'''

          if old_zoom not in t:
              raise SystemExit("inline zoom missing")
          t = t.replace(old_zoom, "        {/* Glass touch ripple */}")

          marker = '''      <div className="relative" style={{ width: displaySize.w || undefined, height: displaySize.h || undefined }}>'''
          zoom_block = '''      {/* Zoom controls — fixed to stage viewport, not the image box (aspect-independent) */}
      <div
        className="pointer-events-none absolute bottom-3 right-3 z-30 flex flex-col gap-1.5"
        data-circle-zoom-controls="true"
        style={{ bottom: "max(0.75rem, env(safe-area-inset-bottom))" }}
      >
        <button
          type="button"
          aria-label="Zoom in"
          onClick={() => setUserZoom((z) => Math.min(3, Math.round((z + 0.25) * 100) / 100))}
          className="pointer-events-auto grid h-9 w-9 place-items-center rounded-xl border border-white/20 bg-black/55 text-sm font-bold text-white shadow-md backdrop-blur-md"
        >
          +
        </button>
        <button
          type="button"
          aria-label="Zoom out"
          onClick={() => setUserZoom((z) => Math.max(0.5, Math.round((z - 0.25) * 100) / 100))}
          className="pointer-events-auto grid h-9 w-9 place-items-center rounded-xl border border-white/20 bg-black/55 text-sm font-bold text-white shadow-md backdrop-blur-md"
        >
          −
        </button>
      </div>
'''
          if marker not in t:
              raise SystemExit("image wrapper missing")
          t = t.replace(marker, zoom_block + marker, 1)
          p.write_text(t)
          assert "destination-in" in t and "data-circle-zoom-controls" in t

          # --- CircleEditShell lock icon ---
          s = Path("src/components/circle-edit/CircleEditShell.tsx")
          st = s.read_text()
          st = st.replace(
              'import { ArrowLeft, Info, Upload, X, Sparkles } from "lucide-react";',
              'import { ArrowLeft, Info, Upload, X, Sparkles, Lock } from "lucide-react";',
          )
          old_lock = '{id === "remove" ? "Remove" : locked ? "Add locked" : "Add"}'
          new_lock = '''{id === "remove" ? (
                "Remove"
              ) : locked ? (
                <span className="inline-flex items-center gap-1">
                  <Lock className="h-3 w-3" aria-hidden />
                  <span>Add</span>
                </span>
              ) : (
                "Add"
              )}'''
          if old_lock not in st:
              raise SystemExit("Add locked label missing")
          st = st.replace(old_lock, new_lock)
          s.write_text(st)

          # --- route place chip overlay ---
          r = Path("src/routes/studio.image.circle-remove.tsx")
          rt = r.read_text()

          old_chip = '''      {mode === "add" && !addLocked ? (
        <>
          {addConfirmed && selectedAsset ? (
            <div className="flex items-center gap-2 rounded-xl border border-[#7B6FE0]/40 bg-[rgba(123,111,224,0.10)] px-2.5 py-1.5">
              <span className="grid h-7 w-7 shrink-0 place-items-center rounded-lg bg-[rgba(123,111,224,0.18)]">
                <AssetIcon asset={selectedAsset} size={20} isDark={isDark} selected />
              </span>
              <span className="min-w-0 flex-1 truncate text-[12px] font-semibold text-[#7B6FE0]">
                {selectedAsset.name}
              </span>
              <button
                type="button"
                aria-label="Clear selected object"
                onClick={() => {
                  setAddObjectId(null);
                  setFactorSelection({});
                  setAddConfirmed(false);
                  setConfirmOpen(false);
                  maskStageRef.current?.clear();
                  setHasMask(false);
                }}
                className="grid h-6 w-6 shrink-0 place-items-center rounded-md text-[13px] font-bold text-[#7B6FE0]/80 hover:bg-[rgba(123,111,224,0.15)]"
              >
                ×
              </button>
              <button
                type="button"
                onClick={() => {
                  setAddConfirmed(false);
                  setConfirmOpen(true);
                }}
                className="shrink-0 rounded-lg px-2 py-0.5 text-[11px] font-medium text-[#7B6FE0]/90"
              >
                Change
              </button>
            </div>
          ) : (
            <button
              type="button"
              onClick={() => setAddDrawerOpen(true)}
              className="rounded-xl border border-[#7B6FE0]/40 bg-[rgba(123,111,224,0.08)] px-3 py-1.5 text-[12px] font-semibold text-[#7B6FE0] backdrop-blur-md"
            >
              Browse objects
            </button>
          )}
        </>
      ) : null}'''

          new_chip = '''      {mode === "add" && !addLocked && !addConfirmed ? (
        <button
          type="button"
          onClick={() => setAddDrawerOpen(true)}
          className="rounded-xl border border-[#7B6FE0]/40 bg-[rgba(123,111,224,0.08)] px-3 py-1.5 text-[12px] font-semibold text-[#7B6FE0] backdrop-blur-md"
        >
          Browse objects
        </button>
      ) : null}'''

          if old_chip not in rt:
              raise SystemExit("controls chip block missing")
          rt = rt.replace(old_chip, new_chip)

          old_stage = '''          <div className="relative flex min-h-0 flex-1 flex-col">
            <CircleMaskStage
              ref={maskStageRef}
              imageUrl={preview}
              tool={drawToolToMaskTool(drawTool)}
              brushSize={brushSize}
              disabled={paintLocked}
              onMaskChange={setHasMask}
              inkColor={inkColor}
              onHistoryChange={onHistoryChange}
            />
          </div>'''

          new_stage = '''          <div className="relative flex min-h-0 flex-1 flex-col">
            {mode === "add" && addConfirmed && selectedAsset ? (
              <div
                className="pointer-events-none absolute left-0 right-0 top-0 z-20 flex justify-center px-3 pt-2"
                data-circle-place-chip="true"
              >
                <div
                  className={cn(
                    "pointer-events-auto flex max-w-[min(100%,22rem)] items-center gap-2 rounded-full border px-2.5 py-1 shadow-md backdrop-blur-xl",
                    isDark
                      ? "border-[#7B6FE0]/45 bg-[rgba(18,20,28,0.82)]"
                      : "border-[#7B6FE0]/35 bg-white/90",
                  )}
                >
                  <span className="grid h-6 w-6 shrink-0 place-items-center rounded-full bg-[rgba(123,111,224,0.22)]">
                    <AssetIcon asset={selectedAsset} size={16} isDark={isDark} selected />
                  </span>
                  <span className="min-w-0 truncate text-[11px] font-semibold text-[#7B6FE0]">
                    Ready to place {selectedAsset.name}
                  </span>
                  <button
                    type="button"
                    aria-label="Change object"
                    onClick={() => {
                      setAddConfirmed(false);
                      setConfirmOpen(true);
                    }}
                    className="shrink-0 rounded-full px-1.5 py-0.5 text-[10px] font-medium text-[#7B6FE0]/90 hover:bg-[rgba(123,111,224,0.15)]"
                  >
                    Change
                  </button>
                  <button
                    type="button"
                    aria-label="Clear selected object"
                    onClick={() => {
                      setAddObjectId(null);
                      setFactorSelection({});
                      setAddConfirmed(false);
                      setConfirmOpen(false);
                      maskStageRef.current?.clear();
                      setHasMask(false);
                    }}
                    className="grid h-5 w-5 shrink-0 place-items-center rounded-full text-[12px] font-bold text-[#7B6FE0]/80 hover:bg-[rgba(123,111,224,0.15)]"
                  >
                    ×
                  </button>
                </div>
              </div>
            ) : null}
            <CircleMaskStage
              ref={maskStageRef}
              imageUrl={preview}
              tool={drawToolToMaskTool(drawTool)}
              brushSize={brushSize}
              disabled={paintLocked}
              onMaskChange={setHasMask}
              inkColor={inkColor}
              onHistoryChange={onHistoryChange}
            />
          </div>'''

          if old_stage not in rt:
              raise SystemExit("stage block missing")
          rt = rt.replace(old_stage, new_stage)
          r.write_text(rt)
          print("patched ok")
          PY

          git add src/components/circle-edit/CircleMaskStage.tsx src/components/circle-edit/CircleEditShell.tsx src/routes/studio.image.circle-remove.tsx
          git commit -m "fix(circle2edit): mask tint only painted pixels + ink colour; working zoom; fixed zoom pos; place-chip overlay; lock icon"
          for i in 1 2 3 4 5; do
            git pull --rebase origin main && git push && break || sleep 3
          done
          echo "TIP=$(git rev-parse HEAD)"
