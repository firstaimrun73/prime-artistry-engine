name: Apply completion pass
on:
  workflow_dispatch:
  push:
    paths:
      - ".restore/completion/**"
      - ".github/workflows/apply-completion-pass.yml"
jobs:
  apply:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Decode generate.functions watermark fail-closed
        run: |
          set -euo pipefail
          python3 << 'PY'
          import base64, zlib
          from pathlib import Path
          h0 = Path(".restore/completion/gen_zlib.half0.txt").read_text().strip()
          h1 = Path(".restore/completion/gen_zlib.half1.txt").read_text().strip()
          data = zlib.decompress(base64.b64decode(h0 + h1))
          Path("src/lib/generate.functions.ts").write_bytes(data)
          print("generate.functions.ts", len(data))
          assert b"Fail closed" in data
          assert b"executeUltraImage" in data
          assert b"executePremiumImage" in data
          assert b"executeStandardImage" in data
          assert b"persistGenerationHistory" in data
          assert b"Multiple reference images require a paid plan" in data
          assert b"returning clean URL" not in data
          print("OK")
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/lib/generate.functions.ts
          git diff --cached --quiet && echo "no changes" && exit 0
          git commit -m "fix(watermark): fail closed on stamp failure — never leak clean Free/provider URL"
          git push
