name: Apply Maluto AutoEditPage UI
on:
  workflow_dispatch:
  push:
    paths:
      - ".restore/maluto_ae_b64_*.txt"
      - ".restore/install_maluto_ae.py"
      - ".restore/TRIGGER_MALUTO_UI"
jobs:
  apply:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install glass AutoEditPage
        run: python3 .restore/install_maluto_ae.py
      - name: Commit
        run: |
          git config user.name "firstaimrun73"
          git config user.email "firstaimrun73@gmail.com"
          git add src/components/auto-edit/AutoEditPage.tsx
          git diff --cached --quiet && echo nochange && exit 0
          git commit -m "feat(maluto): glass AutoEditPage — orb, taglines, v1.8, Upload CTA, avatar, no 2MP chrome"
          git pull --rebase origin main || true
          git push origin HEAD:main
