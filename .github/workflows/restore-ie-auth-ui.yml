name: restore-ie-auth-ui
on:
  push:
    paths:
      - '.github/workflows/restore-ie-auth-ui.yml'
      - '.restore/apply_restore_blob.py'
      - '.restore/restore_manifest.json'
      - '.restore/restore_chunk_*.b64'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    concurrency:
      group: restore-ie-auth-ui
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 5
      - name: Apply restore blob
        run: |
          set -euo pipefail
          python3 .restore/apply_restore_blob.py
      - name: Commit
        run: |
          git config user.name "firstaimrun73"
          git config user.email "firstaimrun73@users.noreply.github.com"
          git add src/components/editor/EditorUpload.tsx \
                  src/lib/studio/studio-taglines-a.ts \
                  src/lib/studio/studio-taglines-b.ts \
                  src/lib/generate.functions.ts \
                  src/components/editor/image/ImageEditor.tsx
          git status
          if git diff --cached --quiet; then echo No changes; else
            git commit -m "fix(image-studio): restore real files — 266 taglines, centered upload, FAL key diagnostics, Auto/Composer intact"
            git pull --rebase origin main || true
            git push origin HEAD:main
          fi
