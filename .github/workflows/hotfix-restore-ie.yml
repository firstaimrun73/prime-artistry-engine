name: hotfix-restore-ie
on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/hotfix-restore-ie.yml"
permissions:
  contents: write
jobs:
  restore:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0
      - name: Restore ImageEditor from 2a3ba88
        run: |
          set -euo pipefail
          git show 2a3ba88e97739e25ccd3f0f092f7643161da7c42:src/components/editor/image/ImageEditor.tsx > src/components/editor/image/ImageEditor.tsx
          test "$(wc -c < src/components/editor/image/ImageEditor.tsx)" -gt 40000
          head -c 80 src/components/editor/image/ImageEditor.tsx
          echo
      - name: Commit restore
        run: |
          git config user.name "firstaimrun73"
          git config user.email "firstaimrun73@users.noreply.github.com"
          git add src/components/editor/image/ImageEditor.tsx
          if git diff --cached --quiet; then echo already restored; else
            git commit -m "hotfix: restore ImageEditor.tsx from 2a3ba88 (undo PLACEHOLDER)"
            git pull --rebase origin main || true
            git push origin HEAD:main
          fi
