name: emergency-restore-generate-functions
on:
  workflow_dispatch:
jobs:
  restore:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Restore generate.functions.ts from good commit 02b9cc02
        run: |
          git show 02b9cc022e4c563169bb2521e511a13f9dc09d9f:src/lib/generate.functions.ts > src/lib/generate.functions.ts
          wc -c src/lib/generate.functions.ts
          head -8 src/lib/generate.functions.ts
          grep -c "finalizeQuote(reservedVideoQuote" src/lib/generate.functions.ts
          grep -c "quoteVideoGeneration" src/lib/generate.functions.ts
          ! grep -q "GENERATE_FUNCTIONS_NEEDS_RESTORE\|RESTORED_MARKER\|PLACEHOLDER" src/lib/generate.functions.ts
      - name: Commit restore
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add src/lib/generate.functions.ts
          git status
          git commit -m "fix(video): restore generate.functions.ts from commit 02b9cc02 (full body + finalizeQuote)" || echo "no change"
          git push
