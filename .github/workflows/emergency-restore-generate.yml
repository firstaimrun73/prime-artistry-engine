name: Emergency restore generate.functions
on: [workflow_dispatch]
permissions:
  contents: write
concurrency:
  group: emergency-restore-generate
  cancel-in-progress: false
jobs:
  restore:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0
      - name: Restore from 1290a060
        run: |
          set -e
          git show 1290a060c2b48fa9d07184d147415d456028ae59:src/lib/generate.functions.ts > src/lib/generate.functions.ts
          wc -c src/lib/generate.functions.ts
          grep -q 'export const generateMedia' src/lib/generate.functions.ts
          if grep -q PLACEHOLDER src/lib/generate.functions.ts; then exit 1; fi
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/lib/generate.functions.ts
          if git diff --cached --quiet; then echo No changes; else
            git commit -m "fix(critical): restore full generate.functions.ts from 1290a060 (remove PLACEHOLDER)"
            git pull --rebase origin main || true
            git push origin HEAD:main
          fi
