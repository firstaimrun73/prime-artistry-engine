name: Apply ImageEditor layout v3
on:
  workflow_dispatch:
  push:
    paths:
      - '.restore/ie_v3_chunk*.txt'
      - '.restore/ie_v3_suffix_a.py'
      - '.restore/ie_v3_suffix_b.py'
      - '.restore/up_v3_data.py'
      - '.restore/apply_ie_v3_embedded.py'
      - '.github/workflows/apply-ie-v3.yml'
concurrency:
  group: apply-ie-v3
  cancel-in-progress: true
jobs:
  apply:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Apply layout package
        run: |
          set -euo pipefail
          ls -la .restore/ie_v3_chunk*.txt .restore/ie_v3_suffix_*.py .restore/up_v3_data.py
          python3 .restore/apply_ie_v3_embedded.py
          test $(wc -c < src/components/editor/image/ImageEditor.tsx) -gt 40000
          grep -q showResultView src/components/editor/image/ImageEditor.tsx
          grep -q "Try Something New" src/components/editor/image/ImageEditor.tsx
          grep -q lg:grid-cols- src/components/editor/image/ImageEditor.tsx
          grep -q compact src/components/editor/EditorUpload.tsx
          ! grep -q '<CreditWarningBanner' src/components/editor/image/ImageEditor.tsx
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/components/editor/image/ImageEditor.tsx src/components/editor/EditorUpload.tsx
          if git diff --cached --quiet; then echo no changes; exit 0; fi
          git commit -m "feat(image-studio): mobile hierarchy + desktop 2-col layout + compact upload"
          git push origin HEAD:main
