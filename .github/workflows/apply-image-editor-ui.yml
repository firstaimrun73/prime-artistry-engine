name: Apply ImageEditor UI pass
on:
  workflow_dispatch:
  push:
    paths:
      - ".restore/ie/**"
      - ".github/workflows/apply-image-editor-ui.yml"
jobs:
  apply:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Reassemble ImageEditor
        run: |
          set -euo pipefail
          python3 << 'PY'
          import base64
          from pathlib import Path
          parts = sorted(Path(".restore/ie").glob("part_*.b64"), key=lambda p: int(p.stem.split("_")[1]))
          b64 = "".join(p.read_text().strip() for p in parts)
          data = base64.b64decode(b64)
          Path("src/components/editor/image/ImageEditor.tsx").write_bytes(data)
          print("ImageEditor", len(data))
          assert b"ImageStudioWeeklyCarousel" in data
          assert b"StudioBackLink className" in data
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/components/editor/image/ImageEditor.tsx
          git diff --cached --quiet && echo "no changes" && exit 0
          git commit -m "feat(image-studio): Home in header; weekly Top-10 below Output; mode-aware actions"
          git push
