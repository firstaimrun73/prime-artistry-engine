name: Restore r2-catalog
on:
  workflow_dispatch:
jobs:
  restore:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Write restored catalog
        run: |
          python3 - <<'PY'
          import base64
          from pathlib import Path
          b64 = open('.github/workflows/_r2_catalog.b64').read().replace('\n','').replace(' ','')
          data = base64.b64decode(b64)
          Path('src/lib/r2-catalog.ts').write_bytes(data)
          text = data.decode()
          assert 'Music_banner' in text
          assert 'vid-m4-forest-warrior' in text
          print('ok', len(text))
          PY
      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/lib/r2-catalog.ts
          git diff --cached --quiet && echo "no changes" && exit 0
          git commit -m "fix(home): restore r2-catalog + add unique media_4 forest warrior"
          git push
