name: Apply MOTIO2EDIT ImageEditor
on:
  workflow_dispatch:
  push:
    paths:
      - ".restore/ie_motio*"
      - ".restore/TRIGGER_IE_MOTIO"
      - ".github/workflows/apply-ie-motio.yml"
concurrency:
  group: apply-ie-motio
  cancel-in-progress: true
jobs:
  apply:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Apply ImageEditor package
        run: |
          set -euo pipefail
          python3 .restore/apply_ie_motio.py
          test $(wc -c < src/components/editor/image/ImageEditor.tsx) -gt 40000
          grep -q canAccessImageExperience src/components/editor/image/ImageEditor.tsx
          grep -q VoiceInputButton src/components/editor/image/ImageEditor.tsx
          ! grep -q PLACEHOLDER src/components/editor/image/ImageEditor.tsx
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/components/editor/image/ImageEditor.tsx
          if git diff --cached --quiet; then echo no changes; exit 0; fi
          git commit -m "fix(image-studio): MOTIO2EDIT ImageEditor — locks, VoiceInput, taglines, Auto/Composer, avatar balance"
          git push origin HEAD:main
