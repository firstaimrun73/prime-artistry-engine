name: restore-generate-functions

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  restore:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout full history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Restore generate.functions.ts from 8291bb7
        run: |
          git show 8291bb7bf112e53808394c94da56df1c4080ab0a:src/lib/generate.functions.ts > src/lib/generate.functions.ts
          SIZE=$(wc -c < src/lib/generate.functions.ts)
          echo "Restored size: $SIZE"
          test "$SIZE" -gt 20000
          grep -q "export const generateMedia" src/lib/generate.functions.ts
          grep -q "executeStandardImage" src/lib/generate.functions.ts
          grep -q "planPremiumMultiGptImage2" src/lib/generate.functions.ts
          grep -q "finalizeMediaAsset" src/lib/generate.functions.ts
          grep -q "deduct_credits" src/lib/generate.functions.ts
          ! grep -q "PLACEHOLDER" src/lib/generate.functions.ts
          ! grep -q "generate.media-core" src/lib/generate.functions.ts

      - name: Commit and push
        run: |
          git config user.name "generate-restore-bot"
          git config user.email "restore@motio2edit.local"
          git add src/lib/generate.functions.ts
          if git diff --cached --quiet; then
            echo "No changes"
            exit 0
          fi
          git commit -m "fix(image): restore complete generate.functions from 8291bb7"
          git push
