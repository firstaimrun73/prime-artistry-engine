name: ci-patch-generation-billing-safety
on:
  workflow_dispatch:
  push:
    branches:
      - fix/backend-generation-billing-safety
    paths:
      - ".restore/TRIGGER_GENERATION_BILLING_SAFETY"
      - "scripts/patch-generation-billing-safety.py"
      - ".github/workflows/ci-patch-generation-billing-safety.yml"
jobs:
  patch:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/backend-generation-billing-safety
          fetch-depth: 0
      - name: Apply surgical video and timeout patches
        run: |
          set -euo pipefail
          python3 scripts/patch-generation-billing-safety.py
          test "$(wc -c < src/lib/generate.functions.ts)" -gt 18000
          grep -q 'export const generateMedia' src/lib/generate.functions.ts
          grep -q 'quoteResult.ok' src/lib/generate.functions.ts
          grep -q 'timed out waiting for provider' src/lib/generate.functions.ts
          grep -q 'deduct_credits' src/lib/generate.functions.ts
          ! grep -q 'debit_credits' src/lib/generate.functions.ts
          ! grep -q 'PLACEHOLDER' src/lib/generate.functions.ts
      - name: Disable destructive recovery helpers
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          disabled = """name: disabled-recovery-helper
on:
  workflow_dispatch:
jobs:
  blocked:
    runs-on: ubuntu-latest
    steps:
      - run: echo disabled && exit 1
"""
          for name in (
              "ci-patch-generate-billing.yml",
              "restore-gf-kontext-billing.yml",
          ):
              p = Path(".github/workflows") / name
              if p.exists():
                  p.write_text(disabled)
                  print("disabled", p)
          PY
      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/lib/generate.functions.ts .github/workflows/
          if git diff --cached --quiet; then echo "no changes"; exit 0; fi
          git commit -m "fix(billing): correct video quote contract, runFal timeout, secure recovery workflows"
          git push origin HEAD:fix/backend-generation-billing-safety
