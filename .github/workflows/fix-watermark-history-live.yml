name: Fix watermark PNG + History load
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/fix-watermark-history-live.yml"
jobs:
  apply:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Install font + generate pill PNG/base64 module
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq fonts-dejavu-core python3-pil
          python3 << 'PY'
          from PIL import Image, ImageDraw, ImageFont
          from pathlib import Path
          import base64

          font = ImageFont.truetype("/usr/share/fonts/truetype/dejavu/DejaVuSans-Bold.ttf", 72)
          text = "Motio2edit"
          dummy = Image.new("RGBA", (10, 10))
          d = ImageDraw.Draw(dummy)
          bbox = d.textbbox((0, 0), text, font=font)
          tw, th = bbox[2] - bbox[0], bbox[3] - bbox[1]
          pad_x, pad_y = 28, 18
          dot_r = 10
          gap = 12
          w = pad_x + dot_r * 2 + gap + tw + pad_x
          h = pad_y + th + pad_y + 8
          img = Image.new("RGBA", (w, h), (0, 0, 0, 0))
          draw = ImageDraw.Draw(img)
          draw.rounded_rectangle([0, 0, w - 1, h - 1], radius=16, fill=(0, 0, 0, 200))
          cx, cy = pad_x + dot_r, h // 2
          draw.ellipse([cx - dot_r, cy - dot_r, cx + dot_r, cy + dot_r], fill=(255, 90, 31, 255))
          tx = cx + dot_r + gap
          ty = (h - th) // 2 - bbox[1]
          draw.text((tx, ty), "Motio", font=font, fill=(255, 255, 255, 255))
          m_bbox = draw.textbbox((tx, ty), "Motio", font=font)
          draw.text((m_bbox[2], ty), "2", font=font, fill=(255, 90, 31, 255))
          t2_bbox = draw.textbbox((m_bbox[2], ty), "2", font=font)
          draw.text((t2_bbox[2], ty), "edit", font=font, fill=(255, 255, 255, 255))
          out_dir = Path("src/lib/watermark/assets")
          out_dir.mkdir(parents=True, exist_ok=True)
          png_path = out_dir / "motio2edit-pill.png"
          img.save(png_path, "PNG")
          b64 = base64.b64encode(png_path.read_bytes()).decode()
          (out_dir / "motio2edit-pill.b64.ts").write_text(
              "/** Pre-rendered Motio2edit watermark pill (PNG base64). */\n"
              + f'export const MOTIO2EDIT_PILL_PNG_B64 =\n  "{b64}";\n'
          )
          print("png", png_path.stat().st_size, "b64", len(b64))
          PY

      - name: Write image.ts (PNG composite, no SVG text fonts)
        run: |
          cat > src/lib/watermark/image.ts << 'EOF'
          import sharp from "sharp";
          import type { WatermarkMode, WatermarkBrand } from "./types";
          import {
            WATERMARK_BRAND_TEXT,
            detectWatermarkRatioKey,
            PRIMARY_SIZE_RATIO,
            FREE_PRIMARY_SIZE_RATIO,
            EDGE_MARGIN_RATIO,
          } from "@/lib/watermark-config";
          import { buildCircleWatermarkSvg } from "@/lib/circle-edit/circle-watermark";
          import { MOTIO2EDIT_PILL_PNG_B64 } from "./assets/motio2edit-pill.b64";

          let cachedPill: Buffer | null = null;

          function getMotioPillPng(): Buffer {
            if (cachedPill) return cachedPill;
            cachedPill = Buffer.from(MOTIO2EDIT_PILL_PNG_B64, "base64");
            return cachedPill;
          }

          function escapeXml(s: string): string {
            return s
              .replace(/&/g, "&" + "amp;")
              .replace(/</g, "&" + "lt;")
              .replace(/>/g, "&" + "gt;")
              .replace(/"/g, "&" + "quot;")
              .replace(/'/g, "&" + "apos;");
          }

          export function buildImageOverlaySvg(
            w: number,
            h: number,
            mode: Exclude<WatermarkMode, "none">,
            _label?: string,
            brand: WatermarkBrand = "generic",
            _freeEnlarged = false,
          ): string {
            if (brand === "circle") {
              return buildCircleWatermarkSvg(w, h);
            }
            if (mode !== "primary+secondary") {
              return `<svg xmlns="http://www.w3.org/2000/svg" width="${w}" height="${h}"></svg>`;
            }
            const minDim = Math.min(w, h);
            const margin = Math.max(10, Math.round(minDim * EDGE_MARGIN_RATIO));
            const marks: string[] = [];
            const cols = 4;
            const rows = 4;
            const cellW = w / (cols + 1);
            const cellH = h / (rows + 1);
            const secFont = Math.max(9, Math.min(28, Math.round(minDim * 0.018)));
            let n = 0;
            for (let row = 0; row < rows; row++) {
              for (let col = 0; col < cols; col++) {
                if (n >= 15) break;
                if (row === rows - 1 && col === cols - 1) continue;
                const mx = cellW * (col + 1) + ((row % 2) * cellW * 0.25);
                const my = cellH * (row + 1);
                if (mx < margin || my < margin || mx > w - margin || my > h - margin) continue;
                marks.push(
                  `<text x="${mx.toFixed(1)}" y="${my.toFixed(1)}" font-family="sans-serif" font-weight="700" font-size="${secFont}" fill="#ffffff" fill-opacity="0.55" text-anchor="middle">${escapeXml(WATERMARK_BRAND_TEXT)}</text>`,
                );
                n++;
              }
            }
            return `<svg xmlns="http://www.w3.org/2000/svg" width="${w}" height="${h}" data-ratio="${detectWatermarkRatioKey(w, h)}">${marks.join("")}</svg>`;
          }

          export async function renderImageWatermark(
            input: Buffer,
            mode: WatermarkMode,
            label?: string,
            brand: WatermarkBrand = "generic",
            freeEnlarged = false,
          ): Promise<Buffer> {
            if (mode === "none") {
              return sharp(input, { failOn: "none" }).jpeg({ quality: 92, mozjpeg: true }).toBuffer();
            }
            const image = sharp(input, { failOn: "none" });
            const meta = await image.metadata();
            const w = meta.width ?? 0;
            const h = meta.height ?? 0;
            if (w < 8 || h < 8) throw new Error("Image too small to watermark.");

            if (brand === "circle") {
              return image
                .composite([
                  {
                    input: Buffer.from(buildImageOverlaySvg(w, h, mode, label, brand, freeEnlarged)),
                    top: 0,
                    left: 0,
                  },
                ])
                .jpeg({ quality: 92, mozjpeg: true })
                .toBuffer();
            }

            const sizeRatio = freeEnlarged ? FREE_PRIMARY_SIZE_RATIO : PRIMARY_SIZE_RATIO;
            const targetH = Math.max(18, Math.min(120, Math.round(Math.min(w, h) * sizeRatio * 2.1)));
            const margin = Math.max(10, Math.round(Math.min(w, h) * EDGE_MARGIN_RATIO));

            const pill = getMotioPillPng();
            const pillMeta = await sharp(pill).metadata();
            const pw = pillMeta.width ?? 527;
            const ph = pillMeta.height ?? 100;
            const scale = targetH / ph;
            const outW = Math.max(40, Math.round(pw * scale));
            const outH = Math.max(18, Math.round(ph * scale));
            const resized = await sharp(pill).resize(outW, outH, { fit: "fill" }).png().toBuffer();

            const left = Math.max(0, w - outW - margin);
            const top = Math.max(0, h - outH - margin);

            const composites: sharp.OverlayOptions[] = [{ input: resized, top, left }];

            if (mode === "primary+secondary") {
              composites.unshift({
                input: Buffer.from(buildImageOverlaySvg(w, h, mode, label, brand, freeEnlarged)),
                top: 0,
                left: 0,
              });
            }

            return image.composite(composites).jpeg({ quality: 92, mozjpeg: true }).toBuffer();
          }

          export async function fetchMediaBuffer(url: string): Promise<Buffer> {
            if (!url.startsWith("https://") && !url.startsWith("http://")) {
              throw new Error("Invalid media URL.");
            }
            const res = await fetch(url, {
              headers: { Accept: "image/*,video/*,*/*" },
              signal: AbortSignal.timeout(90_000),
            });
            if (!res.ok) throw new Error(`Could not fetch media (${res.status}).`);
            return Buffer.from(await res.arrayBuffer());
          }
          EOF

      - name: Harden History load (Free + legacy rows)
        run: |
          python3 << 'PY'
          from pathlib import Path
          p = Path("src/routes/_authenticated.history.tsx")
          t = p.read_text()
          old = '''  const load = () => {
    if (!user) { setLoading(false); setGens([]); setLoadError(null); return; }
    setLoading(true); setLoadError(null);
    supabase.from("generations").select("id, type, prompt, output_url, status, created_at, metadata, retained_as_history, deleted_at, storage_provider, r2_object_key")
      .eq("user_id", user.id)
      .or("retained_as_history.eq.true,retained_as_history.is.null")
      .is("deleted_at", null)
      .order("created_at", { ascending: false }).limit(100)
      .then(async ({ data, error }) => {
        let rows: Generation[] = [];
        if (error) {
          // Real compatibility fallback: core columns only (pre-migration schema).
          console.error("[history] load failed (full select):", error.message, error);
          const fb = await supabase
            .from("generations")
            .select("id, type, prompt, output_url, status, created_at, metadata")
            .eq("user_id", user.id)
            .order("created_at", { ascending: false })
            .limit(100);
          if (fb.error) {
            console.error("[history] core fallback failed:", fb.error.message, fb.error);
            setGens([]);
            setLoadError(fb.error.message);
            toast.error("Could not load history.");
            setLoading(false);
            return;
          }
          rows = ((fb.data as Generation[]) ?? []).filter((g) => isVisibleInHistory(g));
        } else {
          rows = ((data as Generation[]) ?? []).filter((g) => isVisibleInHistory(g));
        }
        try {
          const ids = rows.map((g) => g.id).filter(Boolean);
          if (ids.length > 0) {
            const resolved = await resolveHistoryMedia({ data: { generationIds: ids } });
            const map = resolved?.urls ?? {};
            rows = rows.map((g) => {
              const delivery = map[g.id];
              if (delivery && delivery.startsWith("https://")) {
                return { ...g, output_url: delivery };
              }
              return g;
            });
          }
        } catch (e) {
          console.warn("[history] media resolve skipped:", e);
        }
        setGens(rows);
        setLoadError(null);
        setLoading(false);
      });
  };'''
          new = '''  const load = async () => {
    if (!user) { setLoading(false); setGens([]); setLoadError(null); return; }
    setLoading(true); setLoadError(null);
    try {
      let rows: Generation[] = [];

      // Attempt 1: full schema (retention + storage columns)
      const full = await supabase
        .from("generations")
        .select("id, type, prompt, output_url, status, created_at, metadata, retained_as_history, deleted_at, storage_provider, r2_object_key")
        .eq("user_id", user.id)
        .order("created_at", { ascending: false })
        .limit(100);

      if (!full.error && full.data) {
        rows = ((full.data as Generation[]) ?? []).filter((g) => isVisibleInHistory(g));
      } else {
        if (full.error) console.warn("[history] full select:", full.error.message);

        // Attempt 2: core columns only (legacy rows / pre-migration)
        const core = await supabase
          .from("generations")
          .select("id, type, prompt, output_url, status, created_at, metadata")
          .eq("user_id", user.id)
          .order("created_at", { ascending: false })
          .limit(100);

        if (!core.error && core.data) {
          rows = ((core.data as Generation[]) ?? []).filter((g) => isVisibleInHistory(g));
        } else {
          if (core.error) console.warn("[history] core select:", core.error.message);

          // Attempt 3: absolute minimal — still show something for Free users
          const min = await supabase
            .from("generations")
            .select("id, type, prompt, output_url, status, created_at")
            .eq("user_id", user.id)
            .order("created_at", { ascending: false })
            .limit(100);

          if (min.error) {
            console.error("[history] all selects failed:", min.error.message);
            setGens([]);
            setLoadError(min.error.message);
            toast.error("Could not load history.");
            setLoading(false);
            return;
          }
          rows = ((min.data as Generation[]) ?? []).filter((g) => isVisibleInHistory(g));
        }
      }

      // Best-effort private media re-sign; never fail the whole page
      try {
        const ids = rows.map((g) => g.id).filter(Boolean);
        if (ids.length > 0) {
          const resolved = await resolveHistoryMedia({ data: { generationIds: ids } });
          const map = resolved?.urls ?? {};
          rows = rows.map((g) => {
            const delivery = map[g.id];
            if (delivery && delivery.startsWith("https://")) {
              return { ...g, output_url: delivery };
            }
            return g;
          });
        }
      } catch (e) {
        console.warn("[history] media resolve skipped:", e);
      }

      setGens(rows);
      setLoadError(null);
    } catch (e) {
      console.error("[history] unexpected load error:", e);
      setGens([]);
      setLoadError(e instanceof Error ? e.message : "Unknown error");
      toast.error("Could not load history.");
    } finally {
      setLoading(false);
    }
  };'''
          if old not in t:
              if "Attempt 3: absolute minimal" in t:
                  print("history already hardened")
              else:
                  raise SystemExit("history load block not found")
          else:
              p.write_text(t.replace(old, new, 1))
              print("history load hardened")
          PY

      - name: Verify watermark asset + no tofu path
        run: |
          set -euo pipefail
          test -f src/lib/watermark/assets/motio2edit-pill.png
          test -f src/lib/watermark/assets/motio2edit-pill.b64.ts
          grep -q MOTIO2EDIT_PILL_PNG_B64 src/lib/watermark/image.ts
          grep -q "Attempt 3: absolute minimal" src/routes/_authenticated.history.tsx
          # Ensure generate.functions not stubbed
          SIZE=$(wc -c < src/lib/generate.functions.ts)
          test "$SIZE" -gt 20000

      - name: Commit and push
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/lib/watermark/assets/motio2edit-pill.png \
                  src/lib/watermark/assets/motio2edit-pill.b64.ts \
                  src/lib/watermark/image.ts \
                  src/routes/_authenticated.history.tsx
          if git diff --cached --quiet; then echo no-changes; exit 0; fi
          git commit -m "fix(live): Motio2edit PNG watermark + History multi-fallback for Free/legacy"
          git push
