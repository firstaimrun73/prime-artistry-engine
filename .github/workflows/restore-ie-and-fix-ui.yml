import itertools, random, re
from pathlib import Path
random.seed(42)
bases = {"creativity": ["Turn your imagination into reality", "Every image begins with an idea", "Create something extraordinary today", "Your imagination has no limits", "Make your vision visible", "Transform ordinary into extraordinary", "Bring your creative ideas to life", "Imagine it. Describe it. Create it", "Your next masterpiece starts here", "Let creativity take the lead", "Ideas become images here", "What will you invent today", "Sketch with words, finish with AI", "Dream it. Generate it", "The blank canvas is waiting", "One prompt away from amazing", "From thought to visual in seconds", "Unlock a new visual language", "Creativity compounds with every try", "Start with a spark of an idea"], "photography": ["Frame the moment you imagine", "Capture light that never existed", "Compose a shot only you can see", "Rewrite the light in any scene", "Shoot without a camera today", "Portrait light, studio control", "Golden hour on demand", "Every angle starts with a prompt", "Photo realism from pure description", "Lens and light at your command"], "art": ["Paint with language instead of brushes", "Oil, ink, or watercolor—your call", "Gallery walls start as sentences", "Abstract becomes tangible here", "Brushstroke precision from text", "Art direction in a single line", "From sketchbook to finished piece", "Style transfer of the imagination", "Curate a world that does not exist yet", "Fine art resolution of your idea"], "portraits": ["Faces that feel familiar and new", "Character sheets from a short brief", "Expression, age, and mood in words", "Portrait lighting without a studio", "Identity preserved, style transformed", "Headshots that match the brief", "Emotion written into the eyes", "Cast any character you describe", "Skin, hair, and light under control", "Likeness guided by your references"], "cinematic": ["Cinematic frames from a logline", "Camera moves described, then seen", "Film stills that never needed a set", "Mood boards that become final frames", "Anamorphic feeling from a prompt", "Story beats as still images", "Color grade before the shoot", "Blocking without a crew", "Scene continuity from text", "Director notes, visual results"], "fantasy": ["Worlds that only exist in your head", "Dragons, cities, and quiet magic", "Myth made visible in minutes", "Enchanted forests on demand", "Armor, castles, and soft power", "Creatures from half-remembered dreams", "Spell light and ancient stone", "Epic scale from a short line", "Lore you can finally see", "Fantasy that feels photographed"], "design": ["Product shots before the prototype", "Packaging concepts in real light", "Brand systems as living images", "UI mockups that look shipped", "Material studies without samples", "Layout exploration at image speed", "Typography meets atmosphere", "Design directions you can show", "Concept art ready for clients", "Visual systems that scale"], "restoration": ["Bring faded photos back to life", "Repair damage with careful AI", "Colorize history with respect", "Sharpen what time softened", "Recover detail from old scans", "Restore faces with gentle care", "Archive quality from imperfect sources", "Healing tools guided by description", "Make memory look present again", "Preserve, enhance, then share"], "imagination": ["What if the sky were different", "Rewrite the weather in a frame", "Place yourself in any era", "Objects that should not exist—yet do", "Surreal scenes that still feel real", "Impossible architecture, solid light", "Hybrid creatures with believable form", "Parallel versions of familiar places", "Stories that only images can tell", "The next idea is already forming"]}
verbs = ["Create", "Build", "Craft", "Shape", "Forge", "Design", "Invent", "Compose", "Render", "Generate", "Reveal", "Unlock", "Spark", "Ignite", "Launch"]
nouns = ["vision", "idea", "scene", "world", "portrait", "story", "moment", "mood", "style", "frame", "concept", "dream", "look", "atmosphere", "character"]
adj = ["bold", "quiet", "cinematic", "vivid", "subtle", "epic", "intimate", "surreal", "precise", "playful", "dramatic", "soft", "sharp", "warm", "cool"]
endings = ["today", "now", "in one prompt", "with a single description", "from pure imagination", "before the day ends", "while inspiration is fresh", "without leaving this page", "and share it instantly", "as only you would"]
lines = set()
for lst in bases.values():
    for s in lst: lines.add(s.rstrip("."))
for v,n,a,e in itertools.product(verbs, nouns, adj, endings):
    if len(lines) >= 2300: break
    lines.add(f"{v} a {a} {n} {e}")
for v,n in itertools.product(verbs, nouns):
    lines.add(f"{v} the {n} you have been holding")
    lines.add(f"Your {n} deserves a {random.choice(adj)} frame")
prefixes = ["Start with", "Begin from", "Lean into", "Follow", "Trust", "Explore", "Push", "Refine", "Expand", "Focus on"]
mids = ["the feeling", "the light", "the subject", "the atmosphere", "the detail", "the silhouette", "the color", "the motion", "the silence", "the scale"]
for p,m in itertools.product(prefixes, mids):
    lines.add(f"{p} {m}, then describe the rest")
    lines.add(f"{p} {m} and let the image arrive")
clean=[]; seen=set()
for s in sorted(lines):
    s=" ".join(s.split()).strip(" .")
    if not s or len(s)<12 or len(s)>90: continue
    k=s.lower()
    if k in seen: continue
    seen.add(k); clean.append(s+".")
    if len(clean)>=2000: break
assert len(clean)==2000 and len(set(clean))==2000
A,B=clean[:1000],clean[1000:]
def fmt(arr,name):
    body=",\n".join(f'  "{x}"' for x in arr)
    return f"export const {name}: readonly string[] = [\n{body},\n];\n"
Path("src/lib/studio/studio-taglines-a.ts").write_text(fmt(A,"STUDIO_TAGLINES_A"))
Path("src/lib/studio/studio-taglines-b.ts").write_text(fmt(B,"STUDIO_TAGLINES_B"))
print("TAGLINES_OK", len(A)+len(B))
