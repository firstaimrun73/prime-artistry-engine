        rep = '''              {/* Empty-state inspiration only — no large selected-image preview */}\n              {gallery.length === 0 && !promptFocused && !prompt.trim() && (\n                <InspirationTagline active className="shrink-0" />\n              )}\n\n              '''
        src = src[:idx] + rep + src[end:]
        print("removed display block")
# credits
