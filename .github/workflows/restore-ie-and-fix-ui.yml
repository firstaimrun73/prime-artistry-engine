name: restore-ie-and-fix-ui
on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/restore-ie-and-fix-ui.yml"
permissions:
  contents: write
jobs:
  restore:
    runs-on: ubuntu-latest
    concurrency:
      group: restore-ie-and-fix-ui
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0
      - name: Restore ImageEditor from pre-PLACEHOLDER commit
        run: |
          set -euo pipefail
          GOOD=2a3ba88e97739e25ccd3f0f092f7643161da7c42
          git show "$GOOD:src/components/editor/image/ImageEditor.tsx" > src/components/editor/image/ImageEditor.tsx
          test "$(wc -c < src/components/editor/image/ImageEditor.tsx)" -gt 40000
          python3 .restore/apply_ui_final_embedded.py 2>/dev/null || true
          # If embedded not ready, surgical fix inline
          python3 << 'PY'
from pathlib import Path
src = Path("src/components/editor/image/ImageEditor.tsx").read_text()
if "PLACEHOLDER" in src and len(src) < 100:
    raise SystemExit("still placeholder")
# ensure imports
if "InspirationTagline" not in src:
    src = src.replace(
