name: Guard music storage architecture
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "src/lib/music.functions.ts"
      - ".github/workflows/patch-music-r2-ingest.yml"
jobs:
  guard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Ensure Music does not re-ingest provider media to R2
        run: |
          set -euo pipefail
          if grep -n "ingestProviderMediaToUserR2" src/lib/music.functions.ts; then
            echo "ERROR: music.functions.ts must not call ingestProviderMediaToUserR2"
            exit 1
          fi
          echo "OK: no Music provider-media R2 ingest"
