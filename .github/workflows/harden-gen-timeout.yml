name: Harden generation timeout recovery
on:
  workflow_dispatch: {}
  push:
    paths:
      - ".github/scripts/patch_late_recovery.py"
permissions:
  contents: write
concurrency:
  group: harden-gen-timeout
  cancel-in-progress: false
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0
      - name: Apply late-recovery hardening
        run: python3 .github/scripts/patch_late_recovery.py
      - name: Verify
        run: |
          set -e
          grep -n "inFlightGenRef\|clientTimedOut && genPromise\|throwIfClientTimedOut" src/components/editor/image/ImageEditor.tsx | head -20
          ! grep -q "ImageEditor stub" src/components/editor/image/ImageEditor.tsx
      - name: Commit
        run: |
          set -e
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/components/editor/image/ImageEditor.tsx
          if git diff --cached --quiet; then
            echo No changes
          else
            git commit -m "fix(image-studio): in-flight lock + late success recovery after client timeout"
            git pull --rebase origin main || true
            git push origin HEAD:main
          fi
