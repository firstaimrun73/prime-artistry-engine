name: c2e-chip-move2
on:
  workflow_dispatch:
  push:
    paths: ['.github/workflows/c2e-chip-move2.yml']
jobs:
  fix:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          python3 << 'PY'
          from pathlib import Path
          r = Path("src/routes/studio.image.circle-remove.tsx")
          rt = r.read_text()
          assert len(rt) > 10000

          # Find and replace controls section: remove chip when confirmed, keep browse when not
          start = rt.find('{mode === "add" && !addLocked ? (')
          assert start > 0, "start missing"
          # end at the first ") : null}" after Browse objects within this block
          browse = rt.find("Browse objects", start)
          assert browse > 0
          end = rt.find(") : null}", browse)
          assert end > 0
          end = end + len(") : null}")
          replacement = '''{mode === "add" && !addLocked && !addConfirmed ? (
        <button
          type="button"
          onClick={() => setAddDrawerOpen(true)}
          className="rounded-xl border border-[#7B6FE0]/40 bg-[rgba(123,111,224,0.08)] px-3 py-1.5 text-[12px] font-semibold text-[#7B6FE0] backdrop-blur-md"
        >
          Browse objects
        </button>
      ) : null}'''
          rt = rt[:start] + replacement + rt[end:]

          if "data-circle-place-chip" not in rt:
              needle = '''          <div className="relative flex min-h-0 flex-1 flex-col">
            <CircleMaskStage'''
              insert = '''          <div className="relative flex min-h-0 flex-1 flex-col">
            {mode === "add" && addConfirmed && selectedAsset ? (
              <div
                className="pointer-events-none absolute inset-x-0 top-2 z-20 flex justify-center px-3"
                data-circle-place-chip="true"
              >
                <div
                  className={cn(
                    "pointer-events-auto flex max-w-[min(100%,20rem)] items-center gap-1.5 rounded-full border px-2.5 py-1 shadow-lg backdrop-blur-xl",
                    isDark
                      ? "border-[#7B6FE0]/40 bg-[rgba(18,20,28,0.88)]"
                      : "border-[#7B6FE0]/30 bg-white/92",
                  )}
                >
                  <span className="grid h-6 w-6 shrink-0 place-items-center rounded-full bg-[rgba(123,111,224,0.2)]">
                    <AssetIcon asset={selectedAsset} size={16} isDark={isDark} selected />
                  </span>
                  <span className="min-w-0 truncate text-[11px] font-semibold text-[#7B6FE0]">
                    {selectedAsset.name}
                  </span>
                  <button
                    type="button"
                    aria-label="Change object"
                    onClick={() => {
                      setAddConfirmed(false);
                      setConfirmOpen(true);
                    }}
                    className="shrink-0 rounded-full px-1.5 py-0.5 text-[10px] font-medium text-[#7B6FE0]/90 hover:bg-[rgba(123,111,224,0.15)]"
                  >
                    Change
                  </button>
                  <button
                    type="button"
                    aria-label="Clear selected object"
                    onClick={() => {
                      setAddObjectId(null);
                      setFactorSelection({});
                      setAddConfirmed(false);
                      setConfirmOpen(false);
                      maskStageRef.current?.clear();
                      setHasMask(false);
                    }}
                    className="grid h-5 w-5 shrink-0 place-items-center rounded-full text-[12px] font-bold text-[#7B6FE0]/80 hover:bg-[rgba(123,111,224,0.15)]"
                  >
                    ×
                  </button>
                </div>
              </div>
            ) : null}
            <CircleMaskStage'''
              assert needle in rt, "stage needle missing"
              rt = rt.replace(needle, insert, 1)

          r.write_text(rt)
          assert "data-circle-place-chip" in rt
          assert "!addConfirmed ?" in rt or "!addConfirmed?" in rt or "&& !addConfirmed" in rt
          print("ok", len(rt))
          PY
          git add src/routes/studio.image.circle-remove.tsx
          git commit -m "fix(circle2edit): move selected-object chip to top-center stage overlay"
          git pull --rebase origin main || true
          git push
          git rev-parse HEAD
