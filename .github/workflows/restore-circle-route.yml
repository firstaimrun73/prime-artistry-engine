name: Restore Circle2edit route
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/restore-circle-route.yml'
concurrency:
  group: restore-circle-route
  cancel-in-progress: true
jobs:
  restore:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Commit 1 — restore pure full working route
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          curl -fsSL "https://raw.githubusercontent.com/firstaimrun73/prime-artistry-engine/752671aba9340271673ef178dd7cafdda4a147b4/src/routes/studio.image.circle-remove.tsx" -o src/routes/studio.image.circle-remove.tsx
          LINES=$(wc -l < src/routes/studio.image.circle-remove.tsx)
          CHARS=$(wc -c < src/routes/studio.image.circle-remove.tsx)
          echo "fetched lines=$LINES chars=$CHARS"
          test "$LINES" -ge 800
          grep -q "CircleMaskStage" src/routes/studio.image.circle-remove.tsx
          if grep -q "NOTE: Remaining content truncated" src/routes/studio.image.circle-remove.tsx; then
            echo "ERROR: still a stub"; exit 1
          fi
          git add src/routes/studio.image.circle-remove.tsx
          if git diff --cached --quiet; then
            echo "Pure already matches"
          else
            git commit -m "fix: restore complete circle-remove route (full working file, no truncation)"
            for i in 1 2 3 4 5; do
              git pull --rebase origin main && git push && break || sleep 3
            done
            echo "COMMIT1 done"
          fi
      - name: Commit 2 — item-1 stage max-fill only
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git pull --rebase origin main || true
          python3 << 'PY'
          from pathlib import Path
          p = Path("src/routes/studio.image.circle-remove.tsx")
          t = p.read_text()
          old = '''        ) : (\n          <div className="relative flex min-h-0 flex-1 flex-col">\n            <CircleMaskStage\n              ref={maskStageRef}\n              imageUrl={preview}\n              tool={drawToolToMaskTool(drawTool)}\n              brushSize={brushSize}\n              disabled={paintLocked}\n              onMaskChange={setHasMask}\n              inkColor={inkColor}\n              onHistoryChange={onHistoryChange}\n            />\n          </div>\n        )}'''
          new = '''        ) : (\n          <div className="relative flex h-full min-h-0 w-full flex-1 flex-col" data-circle-stage-fill="max">\n            <CircleMaskStage\n              ref={maskStageRef}\n              imageUrl={preview}\n              tool={drawToolToMaskTool(drawTool)}\n              brushSize={brushSize}\n              disabled={paintLocked}\n              onMaskChange={setHasMask}\n              inkColor={inkColor}\n              onHistoryChange={onHistoryChange}\n            />\n          </div>\n        )}'''
          # normalize for match - use actual newlines
          old = old.replace('\\n', '\n')
          new = new.replace('\\n', '\n')
          if 'data-circle-stage-fill="max"' in t:
              print("item1 already applied")
          elif old in t:
              p.write_text(t.replace(old, new, 1))
              print("item1 patch applied", len(p.read_text()))
          else:
              # fuzzy: find CircleMaskStage block in select phase
              import re
              pat = re.compile(
                  r'(\s*\) : \(\n\s*)<div className="relative flex min-h-0 flex-1 flex-col">(\n\s*<CircleMaskStage[\s\S]*?</CircleMaskStage>\n\s*</div>\n\s*\)\})',
                  re.M
              )
              m = pat.search(t)
              if not m:
                  raise SystemExit("pattern not found")
              t2 = pat.sub(
                  r'\1<div className="relative flex h-full min-h-0 w-full flex-1 flex-col" data-circle-stage-fill="max">\2',
                  t, count=1
              )
              p.write_text(t2)
              print("item1 fuzzy patch applied", len(t2))
          PY
          git add src/routes/studio.image.circle-remove.tsx
          if git diff --cached --quiet; then
            echo "No item1 changes"
          else
            git commit -m "Circle2edit item 1: maximize canvas stage fill (Add=Remove identical size)"
            for i in 1 2 3 4 5; do
              git pull --rebase origin main && git push && break || sleep 3
            done
            echo "COMMIT2 done"
          fi
          echo "=== verify final ==="
          wc -l src/routes/studio.image.circle-remove.tsx
          grep -n "data-circle-stage-fill" src/routes/studio.image.circle-remove.tsx || true
          tail -8 src/routes/studio.image.circle-remove.tsx
