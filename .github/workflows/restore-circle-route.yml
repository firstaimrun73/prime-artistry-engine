name: Restore Circle2edit route
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/restore-circle-route.yml'
jobs:
  restore:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Fetch known-good route and apply item1 canvas fill
        run: |
          set -euo pipefail
          curl -fsSL "https://cdn.jsdelivr.net/gh/firstaimrun73/prime-artistry-engine@752671aba9340271673ef178dd7cafdda4a147b4/src/routes/studio.image.circle-remove.tsx" -o src/routes/studio.image.circle-remove.tsx
          python3 << 'PY'
          from pathlib import Path
          t = Path("src/routes/studio.image.circle-remove.tsx").read_text()
          old = '''        ) : (
          <div className="relative flex min-h-0 flex-1 flex-col">
            <CircleMaskStage
              ref={maskStageRef}
              imageUrl={preview}
              tool={drawToolToMaskTool(drawTool)}
              brushSize={brushSize}
              disabled={paintLocked}
              onMaskChange={setHasMask}
              inkColor={inkColor}
              onHistoryChange={onHistoryChange}
            />
          </div>
        )}'''
          new = '''        ) : (
          <div className="relative flex h-full min-h-0 w-full flex-1 flex-col" data-circle-stage-fill="max">
            <CircleMaskStage
              ref={maskStageRef}
              imageUrl={preview}
              tool={drawToolToMaskTool(drawTool)}
              brushSize={brushSize}
              disabled={paintLocked}
              onMaskChange={setHasMask}
              inkColor={inkColor}
              onHistoryChange={onHistoryChange}
            />
          </div>
        )}'''
          if old not in t:
              # already patched or different — still keep full file
              print("pattern not found; keeping fetched file as-is", len(t))
          else:
              Path("src/routes/studio.image.circle-remove.tsx").write_text(t.replace(old, new))
              print("restored+patched", len(t))
          PY
      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add src/routes/studio.image.circle-remove.tsx
          if git diff --cached --quiet; then
            echo "No changes"
            exit 0
          fi
          git commit -m "fix: restore full circle-remove route + max canvas stage fill (item 1)"
          git push
