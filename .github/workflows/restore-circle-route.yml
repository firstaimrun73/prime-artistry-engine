name: Restore Circle2edit route
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/restore-circle-route.yml'
concurrency:
  group: restore-circle-route
  cancel-in-progress: true
jobs:
  restore:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Commit 1 — restore pure full working route
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          # Prefer good SHA with full file (pre-placeholder)
          curl -fsSL "https://raw.githubusercontent.com/firstaimrun73/prime-artistry-engine/1d622a000d112fd59f06667c0327fde329181b35/src/routes/studio.image.circle-remove.tsx" -o src/routes/studio.image.circle-remove.tsx
          LINES=$(wc -l < src/routes/studio.image.circle-remove.tsx)
          CHARS=$(wc -c < src/routes/studio.image.circle-remove.tsx)
          echo "fetched lines=$LINES chars=$CHARS"
          test "$LINES" -ge 800
          grep -q "CircleMaskStage" src/routes/studio.image.circle-remove.tsx
          if grep -q "NOTE: Remaining content truncated" src/routes/studio.image.circle-remove.tsx; then
            echo "ERROR: still a stub"; exit 1
          fi
          if grep -q "PLACEHOLDER" src/routes/studio.image.circle-remove.tsx; then
            echo "ERROR: placeholder"; exit 1
          fi
          git add src/routes/studio.image.circle-remove.tsx
          if git diff --cached --quiet; then
            echo "Pure already matches"
          else
            git commit -m "fix: restore complete circle-remove route (full working file)"
            for i in 1 2 3 4 5; do
              git pull --rebase origin main && git push && break || sleep 3
            done
            echo "COMMIT1 done"
          fi
      - name: Commit 2 — ensure max stage fill + hasImage prop
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git pull --rebase origin main || true
          python3 << 'PY'
          from pathlib import Path
          p = Path("src/routes/studio.image.circle-remove.tsx")
          t = p.read_text()
          # hasImage on main shell
          if "hasImage={!!preview}" not in t:
              t = t.replace(
                  "      onBack={goBack}\n      controls={controls}",
                  "      onBack={goBack}\n      hasImage={!!preview}\n      controls={controls}",
                  1,
              )
              print("added hasImage main")
          if 'hasImage={true}' not in t and 'controls={null}' in t:
              t = t.replace("controls={null}", "hasImage={true}\n        controls={null}", 1)
              print("added hasImage result")
          # padding / max fill
          t = t.replace('px-[18px] py-3', 'px-3 py-2')
          if 'data-circle-stage-fill="max"' not in t:
              t = t.replace(
                  'className="relative flex min-h-0 flex-1 flex-col">\n            <CircleMaskStage',
                  'className="relative flex h-full min-h-0 w-full flex-1 flex-col p-0" data-circle-stage-fill="max">\n            <CircleMaskStage',
                  1,
              )
          elif ' p-0" data-circle-stage-fill' not in t:
              t = t.replace('data-circle-stage-fill="max"', 'p-0" data-circle-stage-fill="max"'.replace('p-0" ', 'p-0" '), 1)
              # safer:
              t = t.replace(
                  'className="relative flex h-full min-h-0 w-full flex-1 flex-col" data-circle-stage-fill="max"',
                  'className="relative flex h-full min-h-0 w-full flex-1 flex-col p-0" data-circle-stage-fill="max"',
                  1,
              )
          p.write_text(t)
          print("final", len(t), "hasImage", t.count("hasImage"))
          PY
          git add src/routes/studio.image.circle-remove.tsx
          if git diff --cached --quiet; then
            echo "No item2 changes"
          else
            git commit -m "Circle2edit: hasImage compact header + max canvas padding"
            for i in 1 2 3 4 5; do
              git pull --rebase origin main && git push && break || sleep 3
            done
            echo "COMMIT2 done"
          fi
          echo "=== verify final ==="
          wc -l src/routes/studio.image.circle-remove.tsx
          grep -n "hasImage\|data-circle-stage-fill" src/routes/studio.image.circle-remove.tsx || true
