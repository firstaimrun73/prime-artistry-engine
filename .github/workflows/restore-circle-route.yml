name: Restore Circle2edit route
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/restore-circle-route.yml'
jobs:
  restore:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Fetch known-good route and apply item1 canvas fill
        run: |
          set -euo pipefail
          curl -fsSL "https://raw.githubusercontent.com/firstaimrun73/prime-artistry-engine/752671aba9340271673ef178dd7cafdda4a147b4/src/routes/studio.image.circle-remove.tsx" -o src/routes/studio.image.circle-remove.tsx
          wc -l src/routes/studio.image.circle-remove.tsx
          python3 << 'PY'
          from pathlib import Path
          p = Path("src/routes/studio.image.circle-remove.tsx")
          t = p.read_text()
          print("fetched", len(t), "chars")
          old = '''        ) : (
          <div className="relative flex min-h-0 flex-1 flex-col">
            <CircleMaskStage
              ref={maskStageRef}
              imageUrl={preview}
              tool={drawToolToMaskTool(drawTool)}
              brushSize={brushSize}
              disabled={paintLocked}
              onMaskChange={setHasMask}
              inkColor={inkColor}
              onHistoryChange={onHistoryChange}
            />
          </div>
        )}'''
          new = '''        ) : (
          <div className="relative flex h-full min-h-0 w-full flex-1 flex-col" data-circle-stage-fill="max">
            <CircleMaskStage
              ref={maskStageRef}
              imageUrl={preview}
              tool={drawToolToMaskTool(drawTool)}
              brushSize={brushSize}
              disabled={paintLocked}
              onMaskChange={setHasMask}
              inkColor={inkColor}
              onHistoryChange={onHistoryChange}
            />
          </div>
        )}'''
          if old in t:
              t = t.replace(old, new)
              print("applied item1 patch")
          else:
              print("pattern not found; file kept as-is")
          p.write_text(t)
          print("final", len(t))
          PY
      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add src/routes/studio.image.circle-remove.tsx
          if git diff --cached --quiet; then
            echo "No changes"
            exit 0
          fi
          git commit -m "fix: restore full circle-remove route + max canvas stage fill (item 1)"
          git push
