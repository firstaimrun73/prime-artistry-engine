name: Patch music and history-persist storage
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/patch-music-persist-storage.yml"
      - "scripts/patch_music_and_persist_storage.py"
jobs:
  apply:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Apply
        run: |
          set -euo pipefail
          python3 scripts/patch_music_and_persist_storage.py
          grep -q "ingested.storageProvider" src/lib/music.functions.ts
          grep -q privateR2SignedGetUrl src/lib/history-persist.server.ts
          # Guard against generate.functions regression to stub
          SIZE=$(wc -c < src/lib/generate.functions.ts)
          test "$SIZE" -gt 20000
          grep -q executeStandardImage src/lib/generate.functions.ts
          ! grep -q "restore incomplete" src/lib/generate.functions.ts
      - name: Commit
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/lib/music.functions.ts src/lib/history-persist.server.ts
          if git diff --cached --quiet; then echo no-changes; exit 0; fi
          git commit -m "fix(storage): music uses ingested.storageProvider; history-persist signs via private R2"
          git push
