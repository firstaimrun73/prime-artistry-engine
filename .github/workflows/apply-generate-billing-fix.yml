name: Apply billing and email reliability parts
on:
  workflow_dispatch:
  push:
    branches: [fix/image-billing-multiref-email]
    paths:
      - '.restore/**'
jobs:
  restore:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/image-billing-multiref-email
      - name: Reassemble files from verified base64 parts
        run: |
          set -euo pipefail
          python3 << 'PY'
          import base64, json, hashlib
          from pathlib import Path

          def restore(manifest_path: str) -> None:
              m = json.loads(Path(manifest_path).read_text())
              base = manifest_path[: -len(".manifest.json")]
              b64 = "".join(Path(f"{base}.part{i}.b64").read_text().strip() for i in range(m["parts"]))
              data = base64.b64decode(b64)
              assert hashlib.sha256(data).hexdigest() == m["sha256"], m["path"]
              text = data.decode()
              if "generate.functions" in m["path"]:
                  assert "reservedImageQuote" in text
                  assert 'rpc("debit_credits"' not in text
                  assert "createGenerationQuote" in text
              if "templates" in m["path"]:
                  assert "DISPLAY_PRICES" in text
                  assert "Master Studio" in text
                  assert "buildDefaultPlanEmailVars" in text
              Path(m["path"]).write_bytes(data)
              print("wrote", m["path"], len(data))

          restore(".restore/generate.functions.manifest.json")
          restore(".restore/templates.manifest.json")
          PY
      - name: Commit restored sources
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/lib/generate.functions.ts src/emails/templates.ts
          git diff --cached --quiet && echo "no changes" && exit 0
          git commit -m "fix(billing): apply generate.functions + email templates from verified parts"
          git push origin HEAD:fix/image-billing-multiref-email
