name: Image Studio Final Completion
on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/image-studio-final-completion.yml"
      - "scripts/image-studio-final-completion-v2.py"
jobs:
  apply:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Apply completion
        run: |
          set -euo pipefail
          BEFORE=$(wc -c < src/lib/generate.functions.ts)

          # --- Pricing: Studio $55, Master $110 ---
          python3 - <<'PY'
          from pathlib import Path
          import re

          plans = Path("src/lib/plans.ts")
          t = plans.read_text()
          t2 = t
          t2 = t2.replace("price: { USD: 49.99, EUR: 45.99, INR: 4199 }", "price: { USD: 55, EUR: 50.99, INR: 4599 }", 1)
          t2 = t2.replace("price: { USD: 99, EUR: 89.99, INR: 8299 }", "price: { USD: 110, EUR: 99.99, INR: 9199 }", 1)
          t2 = t2.replace('USD: "$49.99"', 'USD: "$55"', 1)
          t2 = t2.replace('USD: "$99"', 'USD: "$110"', 1)
          t2 = t2.replace('INR: "₹4,199"', 'INR: "₹4,599"', 1)
          t2 = t2.replace('EUR: "€45.99"', 'EUR: "€50.99"', 1)
          t2 = t2.replace('INR: "₹8,299"', 'INR: "₹9,199"', 1)
          t2 = t2.replace('EUR: "€89.99"', 'EUR: "€99.99"', 1)
          assert "USD: 55" in t2 or '"$55"' in t2
          assert "USD: 110" in t2 or '"$110"' in t2
          assert "credits: 10000" in t2
          assert "USD: 49.99" not in t2
          plans.write_text(t2)
          print("plans pricing OK")

          # planLimits maxImagesForPlan
          pl = Path("src/utils/planLimits.ts")
          p = pl.read_text()
          p2 = p.replace(
              "  if (isAdmin) return 10;\n  return getPlanLimits(plan ?? \"free\").maxImages;",
              "  if (isAdmin) return Math.max(getPlanLimits(plan ?? \"free\").maxImages, 1);\n  return getPlanLimits(plan ?? \"free\").maxImages;",
              1,
          )
          pl.write_text(p2)

          # studio-tier helper + 8k_max quality list
          st = Path("src/lib/studio/studio-tier.ts")
          s = st.read_text()
          if "aspectRatiosForPlanAndTier" not in s:
              helper = '''
/** Aspect ratios for plan+experience. IMAX/Custom require Master ultraFullUnlocked. */
export function aspectRatiosForPlanAndTier(
  tier: StudioTier,
  ultraFullUnlocked: boolean,
): Array<"1:1" | "4:3" | "16:9" | "9:16" | "3:4" | "21:9" | "imax" | "custom"> {
  const base = aspectRatiosForStudioTier(tier);
  if (!ultraFullUnlocked) {
    return base.filter((a) => a !== "imax" && a !== "custom") as typeof base;
  }
  return base;
}
'''
              m = re.search(r"export function aspectRatiosForStudioTier[\s\S]*?\n\}", s)
              assert m
              s = s[: m.end()] + "\n" + helper + s[m.end() :]
          if "8k_max" not in s:
              s = s.replace(
                  'case "premium":\n      return ["sd", "hd", "2k", "4k", "8k"];',
                  'case "premium":\n      return ["sd", "hd", "2k", "4k", "8k", "8k_max"];',
                  1,
              )
          st.write_text(s)

          # quality-options 8k_max
          q = Path("src/lib/quality-options.ts")
          qt = q.read_text()
          if "8k_max" not in qt:
              qt = qt.replace(
                  'export type ImageQuality = "sd" | "hd" | "2k" | "4k" | "8k";',
                  'export type ImageQuality = "sd" | "hd" | "2k" | "4k" | "8k" | "8k_max";',
                  1,
              )
              qt = qt.replace('  "8k": 4320,\n};', '  "8k": 4320,\n  "8k_max": 4320,\n};', 1)
              idx = qt.find('id: "8k"')
              end = qt.find("},", idx)
              insert = ''',\n  {\n    id: "8k_max",\n    label: "8K Max",\n    title: "8K Max",\n    credits: 0,\n    upscaleFactor: 8,\n    hint: "8K Max · IMAX-capable · Master Ultra",\n  }'''
              qt = qt[: end + 1] + insert + qt[end + 1 :]
              q.write_text(qt)

          # EditorOptionsPanel filters
          eop = Path("src/components/editor/EditorOptionsPanel.tsx")
          e = eop.read_text()
          if "aspectRatiosForPlanAndTier" not in e:
              e = e.replace("aspectRatiosForStudioTier,", "aspectRatiosForStudioTier,\n  aspectRatiosForPlanAndTier,", 1)
          if 'from "@/utils/planLimits"' not in e:
              e = e.replace(
                  'from "@/lib/studio/studio-tier";',
                  'from "@/lib/studio/studio-tier";\nimport { getPlanLimits } from "@/utils/planLimits";',
                  1,
              )
          if "const ultraFull =" not in e:
              e = e.replace(
                  "const expLabel = studioExperienceLabel(studioTier);",
                  "const expLabel = studioExperienceLabel(studioTier);\n  const ultraFull = isAdmin || getPlanLimits(userPlan ?? \"free\").ultraFullUnlocked;",
                  1,
              )
          e = e.replace(
              "aspectRatiosForStudioTier(studioTier).includes(a.id as never)",
              "aspectRatiosForPlanAndTier(studioTier, ultraFull).includes(a.id as never)",
          )
          if 'id !== "8k_max"' not in e:
              e = e.replace(
                  "imageQualitiesForStudioTier(studioTier).includes",
                  'imageQualitiesForStudioTier(studioTier).filter((id) => id !== "8k_max" || ultraFull).includes',
              )
          eop.write_text(e)

          # Ultra types + model custom dims
          ut = Path("src/lib/studio/image/ultra/types.ts")
          utt = ut.read_text()
          if '"custom"' not in utt:
              utt = utt.replace('| "imax";', '| "imax"\n  | "custom";', 1)
              ut.write_text(utt)

          um = Path("src/lib/studio/image/ultra/model.ts")
          umt = um.read_text()
          if 'aspect === "custom"' not in umt and 'm || aspect === "custom"' not in umt:
              needle = '''  if (aspect === "imax") {
    // ~2K-class master for enhancement; delivery upscale uses ultraDeliveryDimensions.
    return { width: 2048, height: 1432 };
  }'''
              if needle in umt:
                  umt = umt.replace(needle, needle + '''
  {
    const m = String(aspect).match(/^(\\d+(?:\\.\\d+)?)\\s*:\\s*(\\d+(?:\\.\\d+)?)$/);
    if (m || aspect === "custom") {
      const rw = m ? Number(m[1]) : 16;
      const rh = m ? Number(m[2]) : 9;
      const long = quality === "sd" ? 896 : 2048;
      if (rw >= rh) {
        return { width: long, height: Math.max(256, Math.round((long * rh) / rw)) };
      }
      return { width: Math.max(256, Math.round((long * rw) / rh)), height: long };
    }
  }''', 1)
              needle2 = '''  if (ar === "imax") {
    const height = Math.round(long / 1.43);
    return { width: long, height };
  }'''
              if needle2 in umt:
                  umt = umt.replace(needle2, needle2 + '''
  {
    const m = String(ar).match(/^(\\d+(?:\\.\\d+)?)\\s*:\\s*(\\d+(?:\\.\\d+)?)$/);
    if (m || ar === "custom") {
      const rw = m ? Number(m[1]) : 16;
      const rh = m ? Number(m[2]) : 9;
      if (rw >= rh) {
        return { width: long, height: Math.max(256, Math.round((long * rh) / rw)) };
      }
      return { width: Math.max(256, Math.round((long * rw) / rh)), height: long };
    }
  }''', 1)
              um.write_text(umt)

          uv = Path("src/lib/studio/image/ultra/validation.ts")
          uvt = uv.read_text()
          uvt = uvt.replace(
              'if (a === "custom") {\n    return { aspect: "16:9" };\n  }',
              'if (a === "custom") {\n    return { aspect: "custom" as UltraAspectRatio };\n  }',
              1,
          )
          uv.write_text(uvt)

          # Server Master-only gate
          genp = Path("src/lib/generate.functions.ts")
          gen = genp.read_text()
          before = len(gen)
          if "Master-only Ultra features" not in gen:
              aidx = gen.find("Plan prompt character ceiling")
              insert_pos = None
              if aidx >= 0:
                  m = re.search(r"Plan prompt character ceiling[\s\S]{0,900}?\n      \}", gen[aidx:])
                  if m:
                      insert_pos = aidx + m.end()
              block = '''
      // Master-only Ultra features: IMAX, Custom aspect, 8k_max.
      {
        const planId = (profile.plan ?? "free") as string;
        const tier = (data.studioTier ?? "standard") as string;
        const full = isAdmin || planId === "business";
        const ar = String(data.aspectRatio ?? "").toLowerCase();
        const q = String(data.imageQuality ?? "").toLowerCase();
        if (!full && tier === "premium") {
          if (ar === "imax" || q === "8k_max") {
            throw new Error("IMAX and 8K Max require Master Studio.");
          }
          if (ar === "custom") {
            throw new Error("Custom aspect ratio requires Master Studio.");
          }
        }
      }
'''
              if insert_pos is not None:
                  gen = gen[:insert_pos] + block + gen[insert_pos:]
                  assert len(gen) > before
                  genp.write_text(gen)
                  print("server Master-only gate added")
              else:
                  print("WARN no insert point for Master-only")

          gen2 = genp.read_text()
          assert len(gen2) >= before
          assert "executeUltraImage" in gen2 and "Fail closed" in gen2
          print("ALL OK")
          PY

          AFTER=$(wc -c < src/lib/generate.functions.ts)
          echo "generate.functions $BEFORE -> $AFTER"
          if [ "$AFTER" -lt 20000 ]; then echo REFUSE; exit 1; fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/lib/plans.ts src/utils/planLimits.ts src/lib/studio/studio-tier.ts \
            src/components/editor/EditorOptionsPanel.tsx src/lib/quality-options.ts \
            src/lib/studio/image/ultra/types.ts src/lib/studio/image/ultra/model.ts \
            src/lib/studio/image/ultra/validation.ts src/lib/generate.functions.ts
          git diff --cached --quiet && echo "no changes" && exit 0
          git commit -m "feat(image-studio): Master \$110 / Studio \$55, IMAX+Custom+8K Max locks"
          git push
