name: Restore generate.functions
on:
  workflow_dispatch:
  push:
    paths:
      - ".restore/gen_txt.*"
      - ".github/workflows/restore-generate.yml"
jobs:
  restore:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Concatenate and restore generate.functions.ts
        run: |
          set -euo pipefail
          N=12
          OUT=src/lib/generate.functions.ts
          : > "$OUT"
          for i in $(seq 0 $((N-1))); do
            f=".restore/gen_txt.part${i}.txt"
            test -f "$f" || { echo "missing $f"; exit 1; }
            cat "$f" >> "$OUT"
          done
          BYTES=$(wc -c < "$OUT")
          echo "wrote $BYTES bytes"
          test "$BYTES" -gt 20000
          ! grep -q PLACEHOLDER "$OUT"
          grep -q executePremiumImage "$OUT"
          grep -q executeUltraImage "$OUT"
          grep -q persistGenerationHistory "$OUT"
          grep -q finalizeMediaAsset "$OUT"
          grep -q "Multiple reference images require" "$OUT"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/lib/generate.functions.ts
          git commit -m "EMERGENCY RESTORE: full generate.functions.ts (routing + free multi lock + gen watermark)"
          git push
