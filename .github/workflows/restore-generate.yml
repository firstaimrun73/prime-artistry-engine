name: Restore generate.functions
on:
  workflow_dispatch:
  push:
    paths:
      - ".restore/gen_zlib.half0.txt"
      - ".restore/gen_zlib.half1.txt"
      - ".github/workflows/restore-generate.yml"
jobs:
  restore:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Concatenate halves, decompress, restore generate.functions.ts
        run: |
          set -euo pipefail
          python3 << 'PY'
          import base64, zlib
          from pathlib import Path
          h0 = Path(".restore/gen_zlib.half0.txt").read_text().strip()
          h1 = Path(".restore/gen_zlib.half1.txt").read_text().strip()
          b64 = h0 + h1
          data = zlib.decompress(base64.b64decode(b64))
          Path("src/lib/generate.functions.ts").write_bytes(data)
          print("wrote", len(data))
          assert len(data) > 20000
          text = data.decode()
          assert "PLACEHOLDER" not in text
          assert "executePremiumImage" in text
          assert "executeUltraImage" in text
          assert "persistGenerationHistory" in text
          assert "finalizeMediaAsset" in text
          assert "Multiple reference images require" in text
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/lib/generate.functions.ts
          git commit -m "EMERGENCY RESTORE: full generate.functions.ts (routing + free multi lock + gen watermark)"
          git push
