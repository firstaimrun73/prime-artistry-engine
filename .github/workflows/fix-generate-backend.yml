name: Fix generate backend Premium/Ultra/Auto
on:
  workflow_dispatch: {}
  push:
    paths:
      - ".github/scripts/patch_generate_backend.py"
      - ".github/scripts/patch_ie_workspace.py"
permissions:
  contents: write
concurrency:
  group: fix-generate-backend
  cancel-in-progress: false
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0
      - name: Apply generate.functions patch
        run: python3 .github/scripts/patch_generate_backend.py
      - name: Verify generate.functions
        run: |
          set -e
          wc -c src/lib/generate.functions.ts
          grep -n "falKey, runStep" src/lib/generate.functions.ts | head -5
          grep -n "AUTO_SERVER" src/lib/generate.functions.ts | head -3
          grep -n "workspaceMode" src/lib/generate.functions.ts | head -5
      - name: Patch ImageEditor workspaceMode
        run: python3 .github/scripts/patch_ie_workspace.py
      - name: Commit
        run: |
          set -e
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/lib/generate.functions.ts src/components/editor/image/ImageEditor.tsx
          git status
          if git diff --cached --quiet; then
            echo No changes
          else
            git commit -m "fix(generate): Premium/Ultra execute signatures + referenceImageUrls + Auto server orchestration"
            git pull --rebase origin main || true
            git push origin HEAD:main
          fi
