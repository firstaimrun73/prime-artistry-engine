name: Image Studio Minimal Final
on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/image-studio-minimal-final.yml"
jobs:
  apply:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Surgical patches
        run: |
          set -euo pipefail
          BEFORE=$(wc -c < src/lib/generate.functions.ts)
          python3 -u - <<'ENDPY'
          from pathlib import Path
          import re, sys

          def main():
              # ImageEditor memory-safe + Unlimited
              ie = Path("src/components/editor/image/ImageEditor.tsx")
              it = ie.read_text()
              assert len(it) > 20000, "IE too small"
              if "isPromptEffectivelyUnlimited" not in it:
                  old = 'import { getPlanLimits, maxPromptCharsForPlan, MULTI_IMAGE_UPGRADE_MESSAGE } from "@/utils/planLimits";'
                  new = 'import { getPlanLimits, maxPromptCharsForPlan, isPromptEffectivelyUnlimited, MULTI_IMAGE_UPGRADE_MESSAGE } from "@/utils/planLimits";'
                  if old not in it:
                      raise SystemExit("import line not found")
                  it = it.replace(old, new, 1)
              if "promptUnlimited=" not in it:
                  needle = 'maxChars={maxPromptCharsForPlan(profile?.plan ?? "free", isAdmin)}'
                  if needle not in it:
                      raise SystemExit("maxChars prop not found")
                  it = it.replace(
                      needle,
                      needle + "\n                  promptUnlimited={isPromptEffectivelyUnlimited(profile?.plan ?? \"free\")}",
                      1,
                  )
              # Build memory-safe block without shell-like ${} confusion
              if "dataUrl: await readAsDataUrl(f)" in it:
                  # replace the dataUrl line only
                  it = it.replace("dataUrl: await readAsDataUrl(f)", "dataUrl: null", 1)
                  # convert Promise.all(async map) to sync map if still present
                  it = it.replace("items = await Promise.all(", "items = (", 1)
                  it = it.replace("accepted.map(async (f) => ({", "accepted.map((f) => ({", 1)
                  # remove trailing ); of Promise.all -> ); of expression
                  # after map there is still ),\n    ); pattern from Promise.all
                  it = it.replace(
                      "file: f,\n      })),\n    );",
                      "file: f,\n      }));",
                      1,
                  )
              it = it.replace(
                  ".map((g) => g.dataUrl)\n      .filter(Boolean) as string[];",
                  ".map((g) => g.dataUrl || g.preview)\n      .filter(Boolean) as string[];",
                  1,
              )
              if "sources = extras.map((g) => g.dataUrl).slice" in it:
                  it = it.replace(
                      "sources = extras.map((g) => g.dataUrl).slice(0, Math.max(0, effectiveMaxImages - 1));",
                      "sources = extras.map((g) => g.dataUrl || g.preview).slice(0, Math.max(0, effectiveMaxImages - 1));",
                      1,
                  )
              ie.write_text(it)
              it2 = ie.read_text()
              assert len(it2) > 20000
              assert "dataUrl: await readAsDataUrl(f)" not in it2
              assert "promptUnlimited" in it2
              print("IE OK")

              # EditorPromptPanel
              epp = Path("src/components/editor/EditorPromptPanel.tsx")
              et = epp.read_text()
              if "promptUnlimited" not in et:
                  et = et.replace("maxChars?: number;", "maxChars?: number;\n  promptUnlimited?: boolean;", 1)
                  et = et.replace("maxChars = 2000,", "maxChars = 2000,\n  promptUnlimited = false,", 1)
                  et = et.replace("{limit >= 7000 ? (", "{promptUnlimited || limit >= 7000 ? (", 1)
                  epp.write_text(et)
              print("EPP OK")

              # EditorOptionsPanel
              eop = Path("src/components/editor/EditorOptionsPanel.tsx")
              e = eop.read_text()
              if "aspectRatiosForPlanAndTier" not in e:
                  e = e.replace("aspectRatiosForStudioTier,", "aspectRatiosForStudioTier,\n  aspectRatiosForPlanAndTier,", 1)
              if 'from "@/utils/planLimits"' not in e:
                  e = e.replace(
                      'from "@/lib/studio/studio-tier";',
                      'from "@/lib/studio/studio-tier";\nimport { getPlanLimits } from "@/utils/planLimits";',
                      1,
                  )
              if "const ultraFull =" not in e:
                  e = e.replace(
                      "const expLabel = studioExperienceLabel(studioTier);",
                      'const expLabel = studioExperienceLabel(studioTier);\n  const ultraFull = isAdmin || getPlanLimits(userPlan ?? "free").ultraFullUnlocked;',
                      1,
                  )
              e = e.replace(
                  "aspectRatiosForStudioTier(studioTier).includes(a.id as never)",
                  "aspectRatiosForPlanAndTier(studioTier, ultraFull).includes(a.id as never)",
              )
              if 'id !== "8k_max"' not in e:
                  e = e.replace(
                      "imageQualitiesForStudioTier(studioTier).includes",
                      'imageQualitiesForStudioTier(studioTier).filter((id) => id !== "8k_max" || ultraFull).includes',
                  )
              eop.write_text(e)
              print("EOP OK")

              # generate Master-only
              genp = Path("src/lib/generate.functions.ts")
              gen = genp.read_text()
              before = len(gen)
              assert before > 20000 and "Fail closed" in gen
              if "Master-only Ultra features" not in gen:
                  aidx = gen.find("Plan prompt character ceiling")
                  insert_pos = None
                  if aidx >= 0:
                      m = re.search(r"Plan prompt character ceiling[\s\S]{0,900}?\n      \}", gen[aidx:])
                      if m:
                          insert_pos = aidx + m.end()
                  if insert_pos is None:
                      aidx = gen.find("Experience image-count ceilings")
                      if aidx >= 0:
                          m = re.search(
                              r"supports up to 10 images total \(base \+ references\)\.[\s\S]{0,120}?\}",
                              gen[aidx:],
                          )
                          if m:
                              insert_pos = aidx + m.end()
                  if insert_pos is None:
                      raise SystemExit("no insert point for Master-only")
                  block = (
                      "\n      // Master-only Ultra features: IMAX, Custom aspect, 8k_max.\n"
                      "      {\n"
                      '        const planId = (profile.plan ?? "free") as string;\n'
                      '        const tier = (data.studioTier ?? "standard") as string;\n'
                      '        const full = isAdmin || planId === "business";\n'
                      '        const ar = String(data.aspectRatio ?? "").toLowerCase();\n'
                      '        const q = String(data.imageQuality ?? "").toLowerCase();\n'
                      '        if (!full && tier === "premium") {\n'
                      '          if (ar === "imax" || q === "8k_max") {\n'
                      '            throw new Error("IMAX and 8K Max require Master Studio.");\n'
                      "          }\n"
                      '          if (ar === "custom") {\n'
                      '            throw new Error("Custom aspect ratio requires Master Studio.");\n'
                      "          }\n"
                      "        }\n"
                      "      }\n"
                  )
                  gen = gen[:insert_pos] + block + gen[insert_pos:]
                  genp.write_text(gen)
              gen2 = genp.read_text()
              assert len(gen2) >= before
              assert "Master-only Ultra features" in gen2
              assert "Fail closed" in gen2
              print("GEN OK", len(gen2))

          main()
          ENDPY
          AFTER=$(wc -c < src/lib/generate.functions.ts)
          echo "gen $BEFORE -> $AFTER"
          [ "$AFTER" -ge 20000 ] || exit 1
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/components/editor/image/ImageEditor.tsx \
            src/components/editor/EditorPromptPanel.tsx \
            src/components/editor/EditorOptionsPanel.tsx \
            src/lib/generate.functions.ts
          git status
          git diff --cached --stat
          if git diff --cached --quiet; then echo no-changes; exit 0; fi
          git commit -m "fix(image-studio): Unlimited UI, memory-safe gallery, Master-only gates"
          git push origin HEAD:main
