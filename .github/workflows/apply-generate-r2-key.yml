name: Apply generate r2ObjectKey patch
on:
  workflow_dispatch:
jobs:
  apply:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Apply patch
        run: |
          set -euo pipefail
          python3 << 'PY'
          from pathlib import Path
          p = Path("src/lib/generate.functions.ts")
          t = p.read_text()
          if "r2ObjectKeyFromFinalize" in t:
              print("already patched")
          else:
              t = t.replace(
                  '    if (data.type === "image" && outputUrl) {\n      try {\n        const { finalizeMediaAsset }',
                  '    let r2ObjectKeyFromFinalize: string | null = null;\n    if (data.type === "image" && outputUrl) {\n      try {\n        const { finalizeMediaAsset }',
                  1,
              )
              t = t.replace(
                  """        if (fin.finalUrl && fin.finalUrl.startsWith("https://")) {
          outputUrl = fin.finalUrl;
        }
      } catch (wmErr) {""",
                  """        if (fin.finalUrl && fin.finalUrl.startsWith("https://")) {
          outputUrl = fin.finalUrl;
        }
        if (fin.storagePath) {
          r2ObjectKeyFromFinalize = fin.storagePath;
        }
      } catch (wmErr) {""",
                  1,
              )
              t = t.replace(
                  """      await persistGenerationHistory({
        supabaseAdmin,
        userId,
        type: data.type === "video" ? "video" : "image",
        prompt: data.prompt,
        input_url: data.imageUrl ?? null,
        output_url: outputUrl,
        status: "success",
        metadata: meta,
      });""",
                  """      await persistGenerationHistory({
        supabaseAdmin,
        userId,
        type: data.type === "video" ? "video" : "image",
        prompt: data.prompt,
        input_url: data.imageUrl ?? null,
        output_url: outputUrl,
        status: "success",
        metadata: meta,
        r2ObjectKey: r2ObjectKeyFromFinalize,
      });""",
                  1,
              )
              if "r2ObjectKeyFromFinalize" not in t:
                  raise SystemExit("patch failed")
              p.write_text(t)
              print("patched ok", len(t))
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/lib/generate.functions.ts
          git diff --cached --quiet && echo "no changes" && exit 0
          git commit -m "fix(generate): persist r2_object_key from finalize storagePath"
          git push
