name: Apply generate backend fix
on: [workflow_dispatch]
permissions:
  contents: write
concurrency:
  group: apply-gen-fix
  cancel-in-progress: false
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0
      - name: Apply fixed generate.functions.ts
        run: |
          set -e
          python3 .restore/gen_fix/apply.py
          wc -c src/lib/generate.functions.ts
          grep -n 'runStep: runPremiumStep\|runStep: runUltraStep\|refFromClient' src/lib/generate.functions.ts | head -15
      - name: Patch ImageEditor workspaceMode
        run: |
          python3 << 'PY'
          from pathlib import Path
          p = Path('src/components/editor/image/ImageEditor.tsx')
          t = p.read_text(encoding='utf-8')
          if 'ImageEditor stub' in t: raise SystemExit('stub')
          block = t.split('generate({')[1].split('});')[0]
          if 'workspaceMode' in block:
              print('already')
          else:
              needle = '          keepWatermark: isFreePlanForWm ? true : keepWatermark,\n        },\n      });'
              insert = '          keepWatermark: isFreePlanForWm ? true : keepWatermark,\n          workspaceMode,\n        },\n      });'
              if needle not in t: raise SystemExit('needle')
              p.write_text(t.replace(needle, insert, 1), encoding='utf-8')
              print('IE patched')
          PY
          test $(wc -c < src/components/editor/image/ImageEditor.tsx) -gt 50000
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/lib/generate.functions.ts src/components/editor/image/ImageEditor.tsx
          if git diff --cached --quiet; then echo No changes; else
            git commit -m "fix(generate): Premium/Ultra runStep signatures, referenceImageUrls merge, multi plan"
            git pull --rebase origin main || true
            git push origin HEAD:main
          fi
