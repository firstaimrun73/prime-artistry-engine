name: Restore ImageEditor (full)
on:
  workflow_dispatch:
  push:
    paths:
      - ".restore/ie_payload/**"
      - ".github/workflows/restore-image-editor.yml"
permissions:
  contents: write
concurrency:
  group: restore-image-editor
  cancel-in-progress: false
jobs:
  restore:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0
      - name: Apply ImageEditor restore
        run: |
          python3 .restore/ie_payload/apply_ie_restore.py
          wc -c src/components/editor/image/ImageEditor.tsx
          tail -c 150 src/components/editor/image/ImageEditor.tsx
          # hard fail if stub
          if grep -q "ImageEditor stub" src/components/editor/image/ImageEditor.tsx; then
            echo "STUB DETECTED — abort"
            exit 1
          fi
          if ! grep -q "export function ImageEditor" src/components/editor/image/ImageEditor.tsx; then
            echo "missing export — abort"
            exit 1
          fi
      - name: Typecheck (tsc noEmit)
        run: |
          if [ -f package.json ]; then
            npm ci --ignore-scripts 2>/dev/null || npm install --ignore-scripts 2>/dev/null || true
            npx tsc --noEmit --pretty false 2>&1 | head -80 || true
          fi
      - name: Commit restored file
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/components/editor/image/ImageEditor.tsx
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "fix(image-studio): restore full ImageEditor + Auto intent expansion + admin plan/WM fixes"
            git pull --rebase origin main || true
            git push origin HEAD:main
          fi
