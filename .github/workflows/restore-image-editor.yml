name: Restore ImageEditor
on:
  workflow_dispatch:
  push:
    paths:
      - '.restore/**'
jobs:
  apply:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Reassemble and commit ImageEditor
        run: |
          set -euo pipefail
          python3 << 'PY'
          import base64, json
          from pathlib import Path
          manifest = json.loads(Path('.restore/manifest.json').read_text())
          for item in manifest:
              prefix = item['prefix']
              parts = item['parts']
              path = item['path']
              b64 = ''
              for i in range(parts):
                  p = Path(f'.restore/{prefix}.part{i}.b64')
                  if not p.exists():
                      raise SystemExit(f'missing {p}')
                  b64 += p.read_text().strip()
              data = base64.b64decode(b64)
              Path(path).parent.mkdir(parents=True, exist_ok=True)
              Path(path).write_bytes(data)
              print(path, len(data))
          PY
          test -f src/components/editor/image/ImageEditor.tsx
          SIZE=$(wc -c < src/components/editor/image/ImageEditor.tsx)
          echo "ImageEditor size=$SIZE"
          test "$SIZE" -gt 30000
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/components/editor/image/ImageEditor.tsx
          git diff --cached --quiet && echo "no changes" && exit 0
          git commit -m "fix(Image Studio): restore ImageEditor full source via .restore"
          git push
