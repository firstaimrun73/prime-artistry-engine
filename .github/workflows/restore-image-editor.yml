name: Restore ImageEditor

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/restore-image-editor.yml"

permissions:
  contents: write

jobs:
  restore:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout full history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Restore ImageEditor from known-good commit
        run: |
          set -euo pipefail
          # Full ImageEditor (verified >40KB with real generation code)
          GOOD=6e1d896
          if ! git cat-file -e "${GOOD}^{commit}" 2>/dev/null; then
            GOOD=bc0304b66b63ee8bbc1e596ff5f0f54913b88aee
          fi
          echo "Using good commit: $GOOD"
          git checkout "$GOOD" -- src/components/editor/image/ImageEditor.tsx
          if [ -f src/components/editor/image/ImageEditorCore.tsx ]; then
            git rm -f src/components/editor/image/ImageEditorCore.tsx || rm -f src/components/editor/image/ImageEditorCore.tsx
          fi
          BYTES=$(wc -c < src/components/editor/image/ImageEditor.tsx)
          echo "ImageEditor.tsx size: $BYTES bytes"
          if [ "$BYTES" -lt 40000 ]; then
            echo "ERROR: restored file too small ($BYTES) — aborting"
            exit 1
          fi
          if grep -q 'Re-export workspace' src/components/editor/image/ImageEditor.tsx; then
            echo "ERROR: still a re-export stub"
            exit 1
          fi
          if grep -q 'PLACEHOLDER' src/components/editor/image/ImageEditor.tsx; then
            echo "ERROR: PLACEHOLDER content"
            exit 1
          fi
          if ! grep -q 'export function ImageEditor' src/components/editor/image/ImageEditor.tsx; then
            echo "ERROR: missing ImageEditor export"
            exit 1
          fi
          if ! grep -q 'generateMedia' src/components/editor/image/ImageEditor.tsx; then
            echo "ERROR: missing generation wiring"
            exit 1
          fi

      - name: Commit and push if changed
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A src/components/editor/image/
          if git diff --cached --quiet; then
            echo "No changes — ImageEditor already good"
            exit 0
          fi
          git commit -m "emergency: restore full ImageEditor.tsx from known-good commit (fix production Image Studio)"
          git push origin HEAD:main
