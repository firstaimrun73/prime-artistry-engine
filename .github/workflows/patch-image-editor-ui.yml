name: Patch ImageEditor UI
on:
  workflow_dispatch:
  push:
    paths:
      - "scripts/patch-image-editor-ui.py"
      - ".github/workflows/patch-image-editor-ui.yml"
jobs:
  patch:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Apply surgical patch
        run: |
          set -euo pipefail
          python3 scripts/patch-image-editor-ui.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/components/editor/image/ImageEditor.tsx
          git diff --cached --quiet && echo "no changes" && exit 0
          git commit -m "feat(image-studio): Home in header; weekly Top-10 below Output; watermark default ON"
          git push
