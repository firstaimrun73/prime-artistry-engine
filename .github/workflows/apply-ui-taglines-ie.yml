name: apply-ui-taglines-ie
on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/apply-ui-taglines-ie.yml"
      - ".restore/apply_ui_taglines_ie.py"
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    concurrency:
      group: apply-ui-taglines-ie
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 5
      - name: Apply taglines + ImageEditor UI
        run: |
          set -euo pipefail
          python3 .restore/apply_ui_taglines_ie.py
          test -f src/components/editor/image/InspirationTagline.tsx
          grep -q 'InspirationTagline' src/components/editor/image/ImageEditor.tsx
          grep -q 'return 9' src/lib/studio/studio-tier.ts || true
          python3 -c "from pathlib import Path; import re; t=Path('src/lib/studio/studio-taglines-a.ts').read_text()+Path('src/lib/studio/studio-taglines-b.ts').read_text(); qs=re.findall(r'\"((?:\\\\.|[^\"\\\\])*)\"', t); assert len(qs)>=2000, len(qs); assert len(set(qs))==len(qs)"
          test "$(wc -c < src/components/editor/image/ImageEditor.tsx)" -gt 40000
          echo VERIFY_OK
      - name: Commit
        run: |
          git config user.name "firstaimrun73"
          git config user.email "firstaimrun73@users.noreply.github.com"
          git add src/lib/studio/studio-taglines-a.ts src/lib/studio/studio-taglines-b.ts src/components/editor/image/ImageEditor.tsx
          git status
          if git diff --cached --quiet; then echo No changes; else
            git commit -m "fix(image-studio): unique 2000 taglines, no duplicate preview, mode icons, balance, compact UI"
            git pull --rebase origin main || true
            git push origin HEAD:main
          fi
