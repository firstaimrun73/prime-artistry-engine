name: restore-generate-media
on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/restore-generate-media.yml"
jobs:
  restore:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Restore generate.functions.ts from a059b785
        run: |
          set -euo pipefail
          F=src/lib/generate.functions.ts
          git show a059b7855fd7bdaeddfb3ba54038fbf28c444ff9:"$F" > "$F"
          BYTES=$(wc -c < "$F")
          LINES=$(wc -l < "$F")
          echo "restored bytes=$BYTES lines=$LINES"
          if [ "$BYTES" -lt 15000 ]; then
            echo "ERROR: file too small" >&2
            exit 1
          fi
          if grep -q 'temporarily unavailable while restore completes' "$F"; then
            echo "ERROR: still stub" >&2
            exit 1
          fi
          grep -q 'export const generateMedia' "$F"
          grep -q 'finalizeQuote\|persistGenerationHistory\|quoteVideoGeneration' "$F" || true
          # Prefer markers from full file
          if ! grep -qE 'createServerFn|requireSupabaseAuth' "$F"; then
            echo "ERROR: missing server fn structure" >&2
            exit 1
          fi
          echo OK
      - name: Commit
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/lib/generate.functions.ts
          if git diff --cached --quiet; then
            echo "No changes"
            exit 0
          fi
          git commit -m "fix(critical): restore full generateMedia from a059b785 (remove production stub)"
          git push origin HEAD:main
