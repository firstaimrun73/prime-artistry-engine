name: Hotfix restore full ImageEditor
on:
  workflow_dispatch:
  push:
    paths:
      - ".restore/TRIGGER_HOTFIX_IE"
jobs:
  restore:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Download known-good ImageEditor (ed91933b33c6, 51k)
        run: |
          curl -fsSL -o src/components/editor/image/ImageEditor.tsx \
            "https://raw.githubusercontent.com/firstaimrun73/prime-artistry-engine/ed91933b33c6/src/components/editor/image/ImageEditor.tsx"
          wc -c src/components/editor/image/ImageEditor.tsx
          grep -q "export function ImageEditor" src/components/editor/image/ImageEditor.tsx
          grep -q "canAccessImageExperience" src/components/editor/image/ImageEditor.tsx
          ! grep -q "Image Studio loading" src/components/editor/image/ImageEditor.tsx
          ! grep -q "PLACEHOLDER" src/components/editor/image/ImageEditor.tsx
          test $(wc -c < src/components/editor/image/ImageEditor.tsx) -gt 50000
      - name: Commit restored full ImageEditor
        run: |
          git config user.name "firstaimrun73"
          git config user.email "firstaimrun73@gmail.com"
          git add src/components/editor/image/ImageEditor.tsx
          git diff --cached --quiet && echo "already good" && exit 0
          git commit -m "CRITICAL HOTFIX: restore full 51k ImageEditor.tsx from ed91933b33c6 (working generation, multi-ref, experience locks)"
          git push
