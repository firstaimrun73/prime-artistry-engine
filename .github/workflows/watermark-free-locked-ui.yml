name: Watermark Free Locked UI
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/watermark-free-locked-ui.yml"
jobs:
  apply:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Patch UI
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re
          p = Path("src/components/editor/image/ImageEditor.tsx")
          t = p.read_text()
          if "On — Motio2edit (required on Free)" in t:
              print("already done")
          else:
              free_row = '''{isFreePlanForWm ? (
                      <div className="flex items-center justify-between gap-3 rounded-xl border border-border/60 bg-card/50 px-3 py-2.5 shadow-sm backdrop-blur-md">
                        <div className="min-w-0">
                          <p className="text-xs font-semibold text-foreground">Watermark</p>
                          <p className="text-[11px] text-muted-foreground">On — Motio2edit (required on Free)</p>
                        </div>
                        <span className="shrink-0 rounded-full bg-[#FF5A1F]/15 px-2.5 py-1 text-[11px] font-semibold text-[#FF5A1F]">Locked</span>
                      </div>
                    ) : ('''
              # Replace opening condition only, then close with extra paren before )}
              if "{!isFreePlanForWm && (" not in t:
                  raise SystemExit("expected condition missing")
              t = t.replace("{!isFreePlanForWm && (", free_row, 1)
              # After the paid toggle div closing, we had ")}"  — need ")}"  to become ")}" with extra close for ternary
              # Find the first occurrence after free_row of the toggle close pattern
              # Pattern: </button>\n                      </div>\n                    )}
              old_close = """</button>
                      </div>
                    )}"""
              new_close = """</button>
                      </div>
                    )}"""
              # For ternary we need: </button></div>)}  -> </button></div>)}
              # Actually ternary form: condition ? (free) : (paid)}
              # paid block currently ends with )}
              # After replacing open with "cond ? (free) : (", the end )}
 is still correct for ternary!
              # isFreePlanForWm ? ( free_div ) : ( paid_div )}
              # paid_div ends with )}  - wait paid ends with )
              # Structure:
              # { isFree ? ( <div/> ) : ( <div>button</div> )}
              # Original: { !free && ( <div>button</div> )}
              # After open replace: { isFree ? (free_div) : ( <div>button</div> )}
              # The closing )} still matches. Good.
              p.write_text(t)
              assert "On — Motio2edit (required on Free)" in t
              assert t.count("isFreePlanForWm ?") >= 1
              print("OK", len(t))
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/components/editor/image/ImageEditor.tsx
          if git diff --cached --quiet; then echo no-changes; exit 0; fi
          git commit -m "fix(image-studio): Free watermark shows Locked On row"
          git push origin HEAD:main
