name: Unit tests
on:
  pull_request:
  push:
    branches: [main]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm install --legacy-peer-deps
      - run: npx tsx --test src/lib/billing/image-reservation.test.ts src/lib/studio/image/multi-ref-wiring.test.ts src/emails/plan-email-vars.test.ts src/lib/studio/image/standard/standard-router.test.ts
