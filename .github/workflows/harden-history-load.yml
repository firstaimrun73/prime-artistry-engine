name: Harden History load
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/harden-history-load.yml"
jobs:
  apply:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Patch History load
        run: |
          python3 << 'PY'
          from pathlib import Path
          import re
          p = Path("src/routes/_authenticated.history.tsx")
          t = p.read_text()
          if "all selects failed" in t:
              print("already hardened")
          else:
              new_load = '''  const load = async () => {
    if (!user) { setLoading(false); setGens([]); setLoadError(null); return; }
    setLoading(true); setLoadError(null);
    try {
      let rows: Generation[] = [];
      const full = await supabase
        .from("generations")
        .select("id, type, prompt, output_url, status, created_at, metadata, retained_as_history, deleted_at, storage_provider, r2_object_key")
        .eq("user_id", user.id)
        .order("created_at", { ascending: false })
        .limit(100);
      if (!full.error && full.data) {
        rows = ((full.data as Generation[]) ?? []).filter((g) => isVisibleInHistory(g));
      } else {
        if (full.error) console.warn("[history] full select:", full.error.message);
        const core = await supabase
          .from("generations")
          .select("id, type, prompt, output_url, status, created_at, metadata")
          .eq("user_id", user.id)
          .order("created_at", { ascending: false })
          .limit(100);
        if (!core.error && core.data) {
          rows = ((core.data as Generation[]) ?? []).filter((g) => isVisibleInHistory(g));
        } else {
          if (core.error) console.warn("[history] core select:", core.error.message);
          const min = await supabase
            .from("generations")
            .select("id, type, prompt, output_url, status, created_at")
            .eq("user_id", user.id)
            .order("created_at", { ascending: false })
            .limit(100);
          if (min.error) {
            console.error("[history] all selects failed:", min.error.message);
            setGens([]);
            setLoadError(min.error.message);
            toast.error("Could not load history.");
            setLoading(false);
            return;
          }
          rows = ((min.data as Generation[]) ?? []).filter((g) => isVisibleInHistory(g));
        }
      }
      try {
        const ids = rows.map((g) => g.id).filter(Boolean);
        if (ids.length > 0) {
          const resolved = await resolveHistoryMedia({ data: { generationIds: ids } });
          const map = resolved?.urls ?? {};
          rows = rows.map((g) => {
            const delivery = map[g.id];
            if (delivery && delivery.startsWith("https://")) {
              return { ...g, output_url: delivery };
            }
            return g;
          });
        }
      } catch (e) {
        console.warn("[history] media resolve skipped:", e);
      }
      setGens(rows);
      setLoadError(null);
    } catch (e) {
      console.error("[history] unexpected load error:", e);
      setGens([]);
      setLoadError(e instanceof Error ? e.message : "Unknown error");
      toast.error("Could not load history.");
    } finally {
      setLoading(false);
    }
  };
  useEffect(() => { void load(); }, [user]);
'''
              t2, n = re.subn(
                  r"  const load = \(\) => \{[\s\S]*?\n  \};\n  useEffect\(load, \[user\]\);",
                  new_load,
                  t,
                  count=1,
              )
              if n != 1:
                  raise SystemExit(f"replace failed n={n}")
              p.write_text(t2)
              print("hardened")
          PY
      - name: Generate watermark PNG + image.ts
        run: |
          set -euo pipefail
          sudo apt-get update -qq && sudo apt-get install -y -qq fonts-dejavu-core python3-pil
          python3 << 'PY'
          from PIL import Image, ImageDraw, ImageFont
          from pathlib import Path
          import base64
          font = ImageFont.truetype("/usr/share/fonts/truetype/dejavu/DejaVuSans-Bold.ttf", 72)
          dummy = Image.new("RGBA", (10, 10))
          d = ImageDraw.Draw(dummy)
          bbox = d.textbbox((0, 0), "Motio2edit", font=font)
          tw, th = bbox[2] - bbox[0], bbox[3] - bbox[1]
          pad_x, pad_y, dot_r, gap = 28, 18, 10, 12
          w = pad_x + dot_r * 2 + gap + tw + pad_x
          h = pad_y + th + pad_y + 8
          img = Image.new("RGBA", (w, h), (0, 0, 0, 0))
          draw = ImageDraw.Draw(img)
          draw.rounded_rectangle([0, 0, w - 1, h - 1], radius=16, fill=(0, 0, 0, 200))
          cx, cy = pad_x + dot_r, h // 2
          draw.ellipse([cx - dot_r, cy - dot_r, cx + dot_r, cy + dot_r], fill=(255, 90, 31, 255))
          tx = cx + dot_r + gap
          ty = (h - th) // 2 - bbox[1]
          draw.text((tx, ty), "Motio", font=font, fill=(255, 255, 255, 255))
          m_bbox = draw.textbbox((tx, ty), "Motio", font=font)
          draw.text((m_bbox[2], ty), "2", font=font, fill=(255, 90, 31, 255))
          t2b = draw.textbbox((m_bbox[2], ty), "2", font=font)
          draw.text((t2b[2], ty), "edit", font=font, fill=(255, 255, 255, 255))
          out = Path("src/lib/watermark/assets"); out.mkdir(parents=True, exist_ok=True)
          png = out / "motio2edit-pill.png"; img.save(png, "PNG")
          b64 = base64.b64encode(png.read_bytes()).decode()
          (out / "motio2edit-pill.b64.ts").write_text(
            '/** Pre-rendered Motio2edit watermark pill (PNG base64). */\n'
            f'export const MOTIO2EDIT_PILL_PNG_B64 =\n  "{b64}";\n'
          )
          print("ok", png.stat().st_size, len(b64))
          PY
          # Rewrite image.ts to use the b64 module
          cat > src/lib/watermark/image.ts << 'EOF'
          import sharp from "sharp";
          import type { WatermarkMode, WatermarkBrand } from "./types";
          import {
            WATERMARK_BRAND_TEXT,
            detectWatermarkRatioKey,
            PRIMARY_SIZE_RATIO,
            FREE_PRIMARY_SIZE_RATIO,
            EDGE_MARGIN_RATIO,
          } from "@/lib/watermark-config";
          import { buildCircleWatermarkSvg } from "@/lib/circle-edit/circle-watermark";
          import { MOTIO2EDIT_PILL_PNG_B64 } from "./assets/motio2edit-pill.b64";

          let cachedPill: Buffer | null = null;
          function getMotioPillPng(): Buffer {
            if (cachedPill) return cachedPill;
            cachedPill = Buffer.from(MOTIO2EDIT_PILL_PNG_B64, "base64");
            return cachedPill;
          }
          function escapeXml(s: string): string {
            return s.replace(/&/g, "&"+"amp;").replace(/</g, "&"+"lt;").replace(/>/g, "&"+"gt;").replace(/"/g, "&"+"quot;").replace(/'/g, "&"+"apos;");
          }
          export function buildImageOverlaySvg(w: number, h: number, mode: Exclude<WatermarkMode, "none">, _label?: string, brand: WatermarkBrand = "generic", _freeEnlarged = false): string {
            if (brand === "circle") return buildCircleWatermarkSvg(w, h);
            if (mode !== "primary+secondary") return `<svg xmlns="http://www.w3.org/2000/svg" width="${w}" height="${h}"></svg>`;
            const minDim = Math.min(w, h);
            const margin = Math.max(10, Math.round(minDim * EDGE_MARGIN_RATIO));
            const marks: string[] = [];
            const cols = 4, rows = 4;
            const cellW = w / (cols + 1), cellH = h / (rows + 1);
            const secFont = Math.max(9, Math.min(28, Math.round(minDim * 0.018)));
            let n = 0;
            for (let row = 0; row < rows; row++) {
              for (let col = 0; col < cols; col++) {
                if (n >= 15) break;
                if (row === rows - 1 && col === cols - 1) continue;
                const mx = cellW * (col + 1) + ((row % 2) * cellW * 0.25);
                const my = cellH * (row + 1);
                if (mx < margin || my < margin || mx > w - margin || my > h - margin) continue;
                marks.push(`<text x="${mx.toFixed(1)}" y="${my.toFixed(1)}" font-family="sans-serif" font-weight="700" font-size="${secFont}" fill="#ffffff" fill-opacity="0.55" text-anchor="middle">${escapeXml(WATERMARK_BRAND_TEXT)}</text>`);
                n++;
              }
            }
            return `<svg xmlns="http://www.w3.org/2000/svg" width="${w}" height="${h}" data-ratio="${detectWatermarkRatioKey(w, h)}">${marks.join("")}</svg>`;
          }
          export async function renderImageWatermark(input: Buffer, mode: WatermarkMode, label?: string, brand: WatermarkBrand = "generic", freeEnlarged = false): Promise<Buffer> {
            if (mode === "none") return sharp(input, { failOn: "none" }).jpeg({ quality: 92, mozjpeg: true }).toBuffer();
            const image = sharp(input, { failOn: "none" });
            const meta = await image.metadata();
            const w = meta.width ?? 0, h = meta.height ?? 0;
            if (w < 8 || h < 8) throw new Error("Image too small to watermark.");
            if (brand === "circle") {
              return image.composite([{ input: Buffer.from(buildImageOverlaySvg(w, h, mode, label, brand, freeEnlarged)), top: 0, left: 0 }]).jpeg({ quality: 92, mozjpeg: true }).toBuffer();
            }
            const sizeRatio = freeEnlarged ? FREE_PRIMARY_SIZE_RATIO : PRIMARY_SIZE_RATIO;
            const targetH = Math.max(18, Math.min(120, Math.round(Math.min(w, h) * sizeRatio * 2.1)));
            const margin = Math.max(10, Math.round(Math.min(w, h) * EDGE_MARGIN_RATIO));
            const pill = getMotioPillPng();
            const pillMeta = await sharp(pill).metadata();
            const pw = pillMeta.width ?? 527, ph = pillMeta.height ?? 100;
            const scale = targetH / ph;
            const outW = Math.max(40, Math.round(pw * scale)), outH = Math.max(18, Math.round(ph * scale));
            const resized = await sharp(pill).resize(outW, outH, { fit: "fill" }).png().toBuffer();
            const left = Math.max(0, w - outW - margin), top = Math.max(0, h - outH - margin);
            const composites: sharp.OverlayOptions[] = [{ input: resized, top, left }];
            if (mode === "primary+secondary") {
              composites.unshift({ input: Buffer.from(buildImageOverlaySvg(w, h, mode, label, brand, freeEnlarged)), top: 0, left: 0 });
            }
            return image.composite(composites).jpeg({ quality: 92, mozjpeg: true }).toBuffer();
          }
          export async function fetchMediaBuffer(url: string): Promise<Buffer> {
            if (!url.startsWith("https://") && !url.startsWith("http://")) throw new Error("Invalid media URL.");
            const res = await fetch(url, { headers: { Accept: "image/*,video/*,*/*" }, signal: AbortSignal.timeout(90_000) });
            if (!res.ok) throw new Error(`Could not fetch media (${res.status}).`);
            return Buffer.from(await res.arrayBuffer());
          }
          EOF
      - name: Commit
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/routes/_authenticated.history.tsx src/lib/watermark/
          git status
          if git diff --cached --quiet; then echo no-changes; exit 0; fi
          git commit -m "fix(live): History multi-fallback + Motio2edit PNG watermark"
          git push
