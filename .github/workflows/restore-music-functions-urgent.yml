name: Urgent restore music.functions
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/restore-music-functions-urgent.yml'
jobs:
  restore:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Restore full music.functions.ts from previous good blob
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          # Fetch last known good version from commit before stub (SHA from audit)
          git fetch --depth=50 origin main
          # Prefer file from commit 560e8e6a (ci restore) or 71862813
          if git cat-file -e 560e8e6a4bddc8145ce71c7a7a1d6effbc6e3ee5:src/lib/music.functions.ts 2>/dev/null; then
            git show 560e8e6a4bddc8145ce71c7a7a1d6effbc6e3ee5:src/lib/music.functions.ts > src/lib/music.functions.ts
          elif git cat-file -e 8d5e04064ba157b06a6dc79eb471f604f0f0d788:src/lib/music.functions.ts 2>/dev/null; then
            git show 8d5e04064ba157b06a6dc79eb471f604f0f0d788:src/lib/music.functions.ts > src/lib/music.functions.ts
          else
            echo "Could not find good blob"
            exit 1
          fi
          # Apply critical patches if still on old patterns
          python3 << 'PY'
          from pathlib import Path
          p = Path('src/lib/music.functions.ts')
          t = p.read_text()
          assert 'export const generateMusic' in t, 'restore incomplete'
          t = t.replace('prompt: z.string().trim().max(12_000).optional().default(""),', 'prompt: z.string().trim().max(15_000).optional().default(""),')
          old = '''    const mode = data.mode as MusicMode;
    const qualityTier = (data.qualityTier ?? "standard") as MusicQualityTier;
    const hasVideo = !!(data.videoUrl && isSafeExternalUrl(data.videoUrl));
    const hasImage = !!(data.imageUrl && isSafeExternalUrl(data.imageUrl));
    const durationSeconds = data.durationSeconds ?? 30;
    const videoAudioMode = data.videoAudioMode ?? "replace";

    if (hasVideo && data.videoUrl && !isSafeExternalUrl(data.videoUrl)) {
      throw new Error("Invalid video URL.");
    }
    if (hasImage && data.imageUrl && !isSafeExternalUrl(data.imageUrl)) {
      throw new Error("Invalid image URL.");
    }'''
          new = '''    const mode = data.mode as MusicMode;
    const qualityTier = (data.qualityTier ?? "standard") as MusicQualityTier;
    // Reject invalid media URLs explicitly — never silently treat as "no media"
    if (data.videoUrl && !isSafeExternalUrl(data.videoUrl)) {
      throw new Error("Invalid video URL.");
    }
    if (data.imageUrl && !isSafeExternalUrl(data.imageUrl)) {
      throw new Error("Invalid image URL.");
    }
    const hasVideo = !!data.videoUrl;
    const hasImage = !!data.imageUrl;
    const durationSeconds = data.durationSeconds ?? 30;
    const videoAudioMode = data.videoAudioMode ?? "replace";'''
          if old in t:
            t = t.replace(old, new)
          p.write_text(t)
          print('bytes', len(t))
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/lib/music.functions.ts
          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -m "RESTORE: full music.functions.ts + URL validation + 15k prompt max"
            git push origin HEAD:main
          fi
