name: Urgent restore music.functions
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/restore-music-functions-urgent.yml'
jobs:
  restore:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Restore full music.functions.ts from git history
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          TARGET="src/lib/music.functions.ts"
          CURRENT_SIZE=$(wc -c < "$TARGET" || echo 0)
          echo "Current size: $CURRENT_SIZE"

          # Find most recent commit where file is large (full implementation)
          GOOD_SHA=""
          while read -r sha; do
            size=$(git cat-file -s "$sha:$TARGET" 2>/dev/null || echo 0)
            echo "commit $sha file size $size"
            if [ "$size" -gt 15000 ]; then
              GOOD_SHA=$sha
              break
            fi
          done < <(git log --format=%H -- "$TARGET" | head -80)

          if [ -z "$GOOD_SHA" ]; then
            echo "No good revision found in history"
            exit 1
          fi

          echo "Restoring from $GOOD_SHA"
          git show "$GOOD_SHA:$TARGET" > "$TARGET"

          python3 << 'PY'
          from pathlib import Path
          p = Path("src/lib/music.functions.ts")
          t = p.read_text()
          required = [
              "export const generateMusic",
              "export const estimateMusicCost",
              "export const getVoicePreview",
              "export const getMusicCapabilities",
              "deduct_credits",
              "music_history",
          ]
          for r in required:
              if r not in t:
                  raise SystemExit(f"Missing {r}")

          # Safe patches
          t = t.replace(
              'prompt: z.string().trim().max(12_000).optional().default(""),',
              'prompt: z.string().trim().max(15_000).optional().default(""),',
          )

          old = '''    const mode = data.mode as MusicMode;
    const qualityTier = (data.qualityTier ?? "standard") as MusicQualityTier;
    const hasVideo = !!(data.videoUrl && isSafeExternalUrl(data.videoUrl));
    const hasImage = !!(data.imageUrl && isSafeExternalUrl(data.imageUrl));
    const durationSeconds = data.durationSeconds ?? 30;
    const videoAudioMode = data.videoAudioMode ?? "replace";

    if (hasVideo && data.videoUrl && !isSafeExternalUrl(data.videoUrl)) {
      throw new Error("Invalid video URL.");
    }
    if (hasImage && data.imageUrl && !isSafeExternalUrl(data.imageUrl)) {
      throw new Error("Invalid image URL.");
    }'''

          new = '''    const mode = data.mode as MusicMode;
    const qualityTier = (data.qualityTier ?? "standard") as MusicQualityTier;
    // Reject invalid media URLs explicitly — never silently treat as "no media"
    if (data.videoUrl && !isSafeExternalUrl(data.videoUrl)) {
      throw new Error("Invalid video URL.");
    }
    if (data.imageUrl && !isSafeExternalUrl(data.imageUrl)) {
      throw new Error("Invalid image URL.");
    }
    const hasVideo = !!data.videoUrl;
    const hasImage = !!data.imageUrl;
    const durationSeconds = data.durationSeconds ?? 30;
    const videoAudioMode = data.videoAudioMode ?? "replace";'''

          if old in t:
              t = t.replace(old, new)
              print("Applied URL validation patch")
          else:
              print("URL validation pattern not found (may already be patched)")

          p.write_text(t)
          print("Final size", len(t))
          PY

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$TARGET"
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "RESTORE: full music.functions.ts from history + URL/15k patches"
            git push origin HEAD:main
          fi
