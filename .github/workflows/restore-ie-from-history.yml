name: Restore ImageEditor From History
on:
  workflow_dispatch:
jobs:
  restore:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Restore ImageEditor from a0dd852
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git show a0dd852:src/components/editor/image/ImageEditor.tsx > src/components/editor/image/ImageEditor.tsx
          SIZE=$(wc -c < src/components/editor/image/ImageEditor.tsx)
          echo "restored size=$SIZE"
          test "$SIZE" -gt 30000

          python3 << 'PY'
          from pathlib import Path
          import re
          p = Path("src/components/editor/image/ImageEditor.tsx")
          text = p.read_text()
          assert "PLACEHOLDER" not in text
          assert "export function ImageEditor" in text
          assert "outputUrl" in text

          # Remove costLabel prop from Generate controls (any spacing)
          text2, n = re.subn(
              r"\n\s*costLabel=\{`\$\{cost\} cr`\}\s*",
              "\n",
              text,
              count=1,
          )
          print("costLabel removals", n)
          text = text2

          if "costLabel={" in text:
              print("WARN: costLabel still present after replace")
          else:
              print("costLabel cleared from ImageEditor")

          p.write_text(text)
          print("written", len(text))
          PY

          ! grep -q PLACEHOLDER src/components/editor/image/ImageEditor.tsx
          test $(wc -c < src/components/editor/image/ImageEditor.tsx) -gt 30000

          git add src/components/editor/image/ImageEditor.tsx
          git status
          git commit -m "fix(Image Studio): EMERGENCY restore full ImageEditor from a0dd852 (outputUrl, no stub)"
          git push
