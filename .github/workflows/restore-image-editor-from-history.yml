name: Restore ImageEditor from history
on: [workflow_dispatch]
permissions:
  contents: write
concurrency:
  group: restore-ie-history
  cancel-in-progress: false
jobs:
  restore:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0
      - name: Extract good ImageEditor and patch
        run: |
          set -e
          GOOD_SHA=f3bacb03f70f1f0a7a07b42326a98581b63c6573
          git show ${GOOD_SHA}:src/components/editor/image/ImageEditor.tsx > /tmp/ie_good.tsx
          wc -c /tmp/ie_good.tsx
          python3 .github/scripts/apply_ie_from_history.py
      - name: Verify
        run: |
          set -e
          wc -c src/components/editor/image/ImageEditor.tsx
          tail -c 120 src/components/editor/image/ImageEditor.tsx
          grep -n 'understandIntent\|workspaceMode === "auto"\|isFreePlanForWm\|planMaxImages' src/components/editor/image/ImageEditor.tsx | head -20
          if grep -q "ImageEditor stub" src/components/editor/image/ImageEditor.tsx; then
            echo STUB; exit 1
          fi
          if ! grep -q "export function ImageEditor" src/components/editor/image/ImageEditor.tsx; then
            echo MISSING EXPORT; exit 1
          fi
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/components/editor/image/ImageEditor.tsx
          git status
          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -m "fix(image-studio): restore full ImageEditor from f3bacb03 + Auto intent expansion + admin plan/WM fixes"
            git pull --rebase origin main || true
            git push origin HEAD:main
          fi
