name: fix-ultra-precheck

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Align Ultra pre-check cost with quoteUltraCredits
        run: |
          python3 << 'PY'
          from pathlib import Path
          path = Path("src/lib/generate.functions.ts")
          text = path.read_text()
          if text.count("quoteUltraCredits") >= 2 and "isUltraCandidate({\n                studioTier: data.studioTier" in text and text.find("quoteUltraCredits") < text.find("const falKey"):
              # cost branch already uses quoteUltraCredits before execute
              print("already fixed")
              raise SystemExit(0)
          old = '''                return planned.credits + (data.circlePrepCredits ?? 0);
              })()
            : (() => {
              const refs = (data.referenceImageUrls ?? []).filter((u) => typeof u === "string" && u.startsWith("https://"));
              const credit = computeImageExperienceCredits({
                studioTier: data.studioTier,
                hasSourceImage: !!data.imageUrl,
                referenceCount: refs.length,
                imageQuality: data.imageQuality,
                plan: profile.plan,
                isAdmin,
                circleInstant: !!(data.circleInstant && data.maskImageUrl),
                circleInstantCredits: CIRCLE_INSTANT_CREDITS,
              });
              return credit.credits + (data.circlePrepCredits ?? 0);
            })();'''
          new = '''                return planned.credits + (data.circlePrepCredits ?? 0);
              })()
            : isUltraCandidate({
                studioTier: data.studioTier,
                maskImageUrl: data.maskImageUrl,
                circleInstant: data.circleInstant,
              })
            ? (() => {
                const validated = validateUltraImageRequest({
                  prompt: data.prompt,
                  imageUrl: data.imageUrl,
                  referenceImageUrls: data.referenceImageUrls,
                  imageQuality: data.imageQuality,
                  aspectRatio: data.aspectRatio,
                });
                if (!validated.ok) return STANDARD_FALLBACK_COST;
                const q = quoteUltraCredits({
                  mode: validated.mode,
                  quality: validated.quality,
                  referenceCount: validated.referenceCount,
                });
                return q.credits + (data.circlePrepCredits ?? 0);
              })()
            : (() => {
              const refs = (data.referenceImageUrls ?? []).filter((u) => typeof u === "string" && u.startsWith("https://"));
              const credit = computeImageExperienceCredits({
                studioTier: data.studioTier,
                hasSourceImage: !!data.imageUrl,
                referenceCount: refs.length,
                imageQuality: data.imageQuality,
                plan: profile.plan,
                isAdmin,
                circleInstant: !!(data.circleInstant && data.maskImageUrl),
                circleInstantCredits: CIRCLE_INSTANT_CREDITS,
              });
              return credit.credits + (data.circlePrepCredits ?? 0);
            })();'''
          assert old in text, "cost marker not found"
          path.write_text(text.replace(old, new, 1))
          t2 = path.read_text()
          assert t2.count("quoteUltraCredits") >= 2
          print("fixed", len(t2))
          PY
      - name: Commit
        run: |
          git config user.name restore-bot
          git config user.email restore@local
          git add src/lib/generate.functions.ts
          git diff --cached --quiet && exit 0
          git commit -m "fix(image): Ultra pre-check cost uses quoteUltraCredits (match actual charge)"
          git push
